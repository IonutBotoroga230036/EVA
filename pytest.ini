[pytest]
# The main suite lives in tests/. Each skill's own test_skill.py does `import tools`, so those can't share one
# pytest process (every skill has a tools.py and a test_skill.py); FORGE runs them one by one in its sandbox.
# skills/_forge/ holds unapproved FORGE drafts and must never be collected.
testpaths = tests
norecursedirs = _forge .git .venv __pycache__ data apps node_modules
markers =
    one_brain: run with the v1.0 one brain (the rest of the suite pins the classic routing it was written for)
