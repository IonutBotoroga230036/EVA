system:
  name: "E.V.A."
  version: "0.2.0"
  log_level: "INFO"
  data_dir: "./data"

personas:
  default: "eva"
  available:
    - "eva"
    - "kira"

inference:
  local:
    provider: "ollama"
    base_url: "http://localhost:11434"
    # v0.2 models (6 GB VRAM). The 3B fits fully on the GPU; the 7B spilled to CPU.
    decision_model: "qwen2.5:3b-instruct"
    answer_model: "qwen2.5:3b-instruct"
    vision_model: "qwen2.5vl:3b"        # loaded only when she looks, unloaded right after
    coder_model: "qwen2.5-coder:7b"     # FORGE in local mode (ollama pull qwen2.5-coder:7b)
    think_model: "qwen3:4b"             # deep thinking in local mode (ollama pull qwen3:4b)
    keep_alive: "30m"
    # legacy v0.1 keys, still read by core/orchestrator.py
    router_model: "llama3.2:3b"
    general_model: "llama3.1:8b"
    code_model: "deepseek-coder-v2:6.7b"
  cloud:
    provider: "anthropic"                 # key: ANTHROPIC_API_KEY in config/secrets.env (git-ignored)
    model_light: "claude-haiku-4-5-20251001"
    model_heavy: "claude-sonnet-5"        # FORGE code generation and deep thinking
    mode: "auto"                          # auto | cloud | local ("switch to local mode" by voice)

budget:
  daily_limit_euros: 1.50
  monthly_limit_euros: 50.0             # hard cap across everything cloud
  warning_threshold: 0.80
  fallback_to_local: true
  track_file: "./data/budget.json"

memory:
  # v0.2 CORTEX: one SQLite file for turns, facts, and fact vectors
  cortex_path: "./data/cortex.db"
  embed_model: "nomic-embed-text"      # ollama pull nomic-embed-text ; remove to use keyword-only recall
  dedup_threshold: 0.88                # similarity above which a new fact replaces an old one
  recall_k: 6                          # facts injected into each turn, at most
  continuity_hours: 24                 # a new session resumes turns from within this window
  extract_facts: true                  # learn facts in the background after each answer
  # legacy v0.1 keys, still read by core/orchestrator.py
  chromadb_path: "./data/chromadb"
  sqlite_path: "./data/sqlite/eva.db"
  embedding_model: "all-MiniLM-L6-v2"
  session_ttl_hours: 24

obsidian:
  vault_path: "./data/vault"           # git-ignored. Or your existing vault, e.g. "D:/Obsidian/Second Brain"
  daily_folder: "Daily"

weather:
  model: "auto"                        # auto = KNMI HARMONIE for NL/BE/LU, Open-Meteo best match elsewhere

mcp:
  # Each MCP server becomes a set of tools. Read-only tools run freely; anything that
  # changes things asks "shall I go ahead?" unless listed in trusted_tools.
  servers:
    # Google Calendar (Milestone F, MCP-first). One-time setup:
    #   1. Google Cloud Console: new project, enable "Google Calendar API", OAuth consent screen
    #      (External, add yourself as test user), Credentials -> OAuth client ID -> Desktop app,
    #      download the JSON to D:/Project E.V.A/secrets/gcp-oauth.keys.json (OUTSIDE the repo).
    #   2. PowerShell:  $env:GOOGLE_OAUTH_CREDENTIALS="D:/Project E.V.A/secrets/gcp-oauth.keys.json"
    #                   npx @cocal/google-calendar-mcp auth
    #   3. Set enabled: true and restart E.V.A.
    - name: calendar
      enabled: false
      transport: stdio
      command: npx
      args: ["-y", "@cocal/google-calendar-mcp"]
      env:
        GOOGLE_OAUTH_CREDENTIALS: "D:/Project E.V.A/secrets/gcp-oauth.keys.json"
        ENABLED_TOOLS: "list-events,search-events,create-event,get-current-time"
      tools: ["list-events", "search-events", "create-event", "get-current-time"]
      read_only_tools: ["list-events", "search-events", "get-current-time"]
      trusted_tools: []                  # create-event asks first
      timeout: 90                        # first start downloads the package via npx

spotify:
  client_id: ""                        # put yours in settings.local.yaml (see docs/SPOTIFY_SETUP.md)

telegram:
  enabled: true                        # needs TELEGRAM_BOT_TOKEN in config/secrets.env (from @BotFather)
  proactive: "always"                  # always | when_away (only if no E.V.A. window is open) | never
  allowed_user_ids: []                 # filled by pairing (data/telegram.json); or put your id here

oracle:
  email_alerts: "important"            # important | all | off
  lead_minutes: 10                     # meeting heads-up
  quiet_hours: "23-8"

email:
  llm_triage: true                     # borderline emails get a second opinion from the LOCAL model

skills:
  dir: "skills"
  match_threshold: 0.62                # cosine needed to load a SKILL.md body into the prompt

voice:
  stt:
    model: "small"
    language: "en"
    device: "cuda"
  tts:
    engine: "kokoro"                   # "kokoro" = her real voice from the server; anything else = browser voice
    voice_eva: "af_heart"
    voice_kira: "am_adam"
    lang_code: "a"                     # a = American English, b = British English
    speed: 1.0
    device: "cpu"                      # keeps all VRAM for the LLM; try "cuda" if replies feel slow
  wake_word:
    engine: "openwakeword"
    words:
      - "eva"
    threshold: 0.7

# legacy: only used by the v0.1 Redis bus. PULSE v0.2 runs in-process, no Redis needed.
redis:
  host: "localhost"
  port: 6379
  db: 0

google:
  # One OAuth client for Calendar and Gmail. Keep it OUTSIDE the repo. See docs/GOOGLE_SETUP.md.
  credentials_path: "D:/Project E.V.A/secrets/gcp-oauth.keys.json"
  timezone: "Europe/Amsterdam"

calendar:
  sync_interval_minutes: 15
  primary: "google"
  sources:
    - "google"
    - "microsoft"
