<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08060f">
<title>E.V.A.</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* ===== Tokens ===== */
:root{
  --void-0:#08060f; --void-1:#0d0a1c; --void-2:#140f2b;
  --violet:#8b5cf6; --violet-bright:#a855f7; --violet-deep:#6d28d9; --violet-deep-hover:#7c3aed;
  --magenta:#c026d3; --lilac:#c4a4ff; --ice:#efeaff;
  --dim:#7a7196;        /* decorative only, below AA for small text */
  --dim-text:#968dba;   /* secondary text, AA on void */
  --offline:#f0506e;
  --glass:linear-gradient(180deg,rgba(34,24,66,.55),rgba(18,13,36,.55));
  --glass-solid:rgba(16,11,32,.86);
  --glass-row:rgba(24,17,48,.5);
  --line:rgba(196,164,255,.18); --line-soft:rgba(196,164,255,.08); --line-strong:rgba(196,164,255,.4);
  --tint:rgba(196,164,255,.06); --tint-2:rgba(139,92,246,.16);
  --glow-card:0 18px 60px -20px rgba(139,92,246,.4);
  --glow-btn:0 0 24px rgba(168,85,247,.35);
  --glow-mic:0 0 32px rgba(168,85,247,.45);
  --glow-alert:0 0 48px -8px rgba(192,38,211,.45);
  --blur-card:blur(20px) saturate(140%); --blur-chrome:blur(18px);
  --font-display:'Chakra Petch',sans-serif; --font-body:'Inter',system-ui,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s16:64px;
  --r-xs:6px; --r-sm:10px; --r-md:12px; --r-row:14px; --r-card:20px; --r-panel:24px; --r-pill:999px;
  --dur-in:360ms; --dur-out:240ms; --dur-layout:420ms; --dur-hover:160ms;
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --rail-w:440px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void-0);color:var(--ice);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--violet-bright);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== App shell ===== */
.eva{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:calc(var(--safe-t) + 20px) calc(var(--safe-r) + 32px) calc(var(--safe-b) + 28px) calc(var(--safe-l) + 32px);
  background:radial-gradient(ellipse 70% 60% at 50% 42%,var(--void-2) 0%,var(--void-1) 45%,var(--void-0) 100%)}
.eva::before{content:"";position:absolute;inset:0 0 auto 0;height:30vh;pointer-events:none;opacity:0;transition:opacity var(--dur-layout) var(--ease-out);
  background:radial-gradient(ellipse 60% 100% at 50% 0%,rgba(192,38,211,.18),transparent 70%)}
.eva::after{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;pointer-events:none;opacity:0;transition:opacity var(--dur-layout) var(--ease-out);
  background:linear-gradient(90deg,transparent,var(--magenta) 30%,var(--violet-bright) 70%,transparent)}
.eva.is-alert::before,.eva.is-alert::after{opacity:1}

.eva-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);position:relative;z-index:2;min-height:44px}
.eva-conn{display:flex;align-items:center;gap:10px}
.eva-conn__dot{width:8px;height:8px;border-radius:50%;background:var(--offline);box-shadow:0 0 12px var(--offline);transition:background var(--dur-hover),box-shadow var(--dur-hover)}
.eva-conn[data-live="true"] .eva-conn__dot{background:var(--violet-bright);box-shadow:0 0 12px var(--violet-bright)}
.eva-brand{font:600 13px/1 var(--font-display);letter-spacing:.28em;color:var(--lilac)}
.eva-conn__text{font-size:12px;color:var(--dim-text)}
.eva-conn[data-live="true"] .eva-conn__text{display:none}
.eva-top__right{display:flex;align-items:center;gap:18px}
.eva-clock{text-align:right}
.eva-clock__time{font:500 22px/1.1 var(--font-display);letter-spacing:.06em}
.eva-clock__date{font-size:12px;color:var(--dim-text);margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--tint);border:1px solid var(--line);color:var(--lilac);transition:background var(--dur-hover),box-shadow var(--dur-hover)}
.icon-btn:hover{background:rgba(196,164,255,.12);box-shadow:0 0 18px rgba(168,85,247,.25)}

/* ===== Projects (v0.6) ===== */
.proj__sec{margin-top:var(--s3);display:flex;flex-direction:column;gap:6px}
.proj__li{font-size:14px;line-height:1.45;color:var(--ice);padding-left:12px;border-left:2px solid var(--line)}
.proj__li--q{border-left-color:var(--magenta)} .proj__li--q b{color:var(--magenta);font-weight:600}
.proj__li--r{color:var(--dim-text);font-size:13px}
.proj__part{display:grid;grid-template-columns:minmax(0,1fr) 34px 70px 64px;gap:8px;align-items:baseline;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
.proj__pname{display:flex;flex-direction:column;min-width:0} .proj__pname a{color:var(--ice)} .proj__pname small{color:var(--dim-text);font-size:12px}
.proj__q{color:var(--dim-text);text-align:right} .proj__eur{text-align:right;font-variant-numeric:tabular-nums}
.proj__st{font:600 10px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim-text);text-align:center}
.proj__st[data-s="chosen"]{color:var(--lilac)} .proj__st[data-s="ordered"]{color:var(--violet-bright)} .proj__st[data-s="have"]{color:#9fe3b8}
.proj__total{border-bottom:0;font-weight:600}

/* ===== Pictures and videos (v0.6) ===== */
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:var(--s3)}
.gal--v{grid-template-columns:repeat(2,minmax(0,1fr))}
.gal__tile{position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line-soft);background:rgba(10,8,24,.6);padding:0;cursor:pointer}
.gal--v .gal__tile{aspect-ratio:16/9}
.gal__tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s var(--ease-out)}
.gal__tile:hover img{transform:scale(1.04)}
.gal__tile.is-playing{aspect-ratio:16/9;grid-column:1/-1}
.gal__tile iframe,.gal__big iframe{width:100%;height:100%;border:0;display:block}
.gal__n{position:absolute;top:6px;left:6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;display:grid;place-items:center;font:600 12px var(--font-display);
  color:var(--ice);background:rgba(18,10,40,.8);border:1px solid var(--line-strong)}
.gal__cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;font-size:12px;line-height:1.3;color:var(--ice);text-align:left;background:linear-gradient(transparent,rgba(8,5,20,.9));
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gal__big{margin-top:var(--s3);border-radius:var(--r-md);overflow:hidden;background:rgba(10,8,24,.6);aspect-ratio:16/10}
.gal__big img{width:100%;height:100%;object-fit:contain;display:block}
.gal__open img{width:100%;height:100%;object-fit:cover}
.lightbox{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:rgba(6,4,14,.92);backdrop-filter:blur(8px);cursor:zoom-out}
.lightbox img{max-width:100%;max-height:82vh;border-radius:var(--r-md);box-shadow:var(--glow-card)}
.lightbox__cap{color:var(--dim-text);font-size:14px;text-align:center}

/* ===== Workbench (v0.5): a task's work, live ===== */
.eva-bench{position:fixed;z-index:9;top:calc(var(--safe-t) + 84px);left:max(24px,var(--safe-l));right:max(24px,var(--safe-r));bottom:calc(var(--safe-b) + 128px);
  display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px;padding:18px;
  border-radius:var(--r-panel);background:linear-gradient(180deg,rgba(26,18,54,.9),rgba(12,9,26,.92));border:1px solid var(--line);
  box-shadow:var(--glow-card),inset 0 0 80px -40px rgba(168,85,247,.35);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  opacity:0;transform:translateY(12px) scale(.985);visibility:hidden;transition:opacity var(--dur-in) var(--ease-out),transform var(--dur-in) var(--ease-out),visibility 0s linear var(--dur-in)}
.eva.bench-open .eva-bench{opacity:1;transform:none;visibility:visible;transition-delay:0s}
.bench__head{grid-column:1 / -1;display:flex;align-items:center;gap:14px;min-width:0}
.bench__title{font:600 20px var(--font-display);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench__status{display:inline-flex;align-items:center;gap:8px;font:600 11px var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--lilac);
  padding:5px 10px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--tint)}
.bench__status i{width:7px;height:7px;border-radius:50%;background:var(--violet-bright);box-shadow:0 0 10px var(--violet-bright)}
.bench__status[data-s="running"] i,.bench__status[data-s="queued"] i{animation:benchPulse 1.2s ease-in-out infinite}
.bench__status[data-s="waiting"] i{background:var(--magenta);box-shadow:0 0 10px var(--magenta)}
.bench__status[data-s="failed"] i{background:var(--offline);box-shadow:0 0 10px var(--offline)}
@keyframes benchPulse{50%{opacity:.25}}
.bench__now{flex:1;min-width:0;color:var(--ice);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench__meta{color:var(--dim-text);font-size:12px;white-space:nowrap}
.bench__side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:hidden}
.bench__plan{display:flex;flex-direction:column;gap:6px;flex:none;max-height:45%;overflow:auto}
.bench__step{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--dim-text)}
.bench__step b{flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:11px}
.bench__step.is-done{color:var(--ice)} .bench__step.is-done b{background:var(--violet-deep);border-color:var(--violet-bright)}
.bench__step.is-next{color:var(--ice)} .bench__step.is-next b{box-shadow:0 0 10px var(--violet-bright);border-color:var(--violet-bright)}
.bench__label{font:600 11px var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--lilac)}
.bench__feed{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px;font-size:13px}
.bench__ev{display:grid;grid-template-columns:42px 14px minmax(0,1fr);gap:6px;color:var(--dim-text);animation:benchIn .3s var(--ease-out)}
.bench__ev time{font-variant-numeric:tabular-nums;opacity:.7}
.bench__ev.is-say{color:var(--ice);font-style:italic}
.bench__ev.is-bad span:nth-child(2){color:var(--offline)}
@keyframes benchIn{from{opacity:0;transform:translateY(-4px)}}
.bench__main{position:relative;display:flex;flex-direction:column;min-height:0;border-radius:var(--r-md);border:1px solid var(--line-soft);background:rgba(6,4,16,.6);overflow:hidden}
.bench__tabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line-soft)}
.bench__tab{font:600 12px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim-text);padding:6px 12px;border-radius:var(--r-sm);border:1px solid transparent;background:transparent;cursor:pointer}
.bench__tab:not(:disabled):not(.is-on):hover{color:var(--ice);background:var(--tint)}
.bench__tab.is-on{color:var(--ice);border-color:var(--line);background:var(--tint-2)}
.bench__tab:disabled{opacity:.35}
.bench__view{position:relative;flex:1;min-height:0;overflow:auto}
.bench__view .model__view{height:100%;min-height:240px}
.bench__code{margin:0;padding:14px 16px;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d9ccff;white-space:pre;tab-size:4}
.bench__code.is-bad{color:#ffb3c1}
.card__links{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.card__links a{color:var(--lilac,#c4a4ff);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bench__screen{display:block;max-width:100%;max-height:100%;margin:auto;object-fit:contain;border-radius:8px;cursor:zoom-in}
.bench__empty{display:grid;place-items:center;height:100%;color:var(--dim-text);font-size:14px;text-align:center;padding:24px}
.bench__scan{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0,rgba(168,85,247,.12) 50%,transparent 100%);
  background-size:100% 220px;background-repeat:no-repeat;animation:benchScan 2.6s linear infinite;opacity:0;transition:opacity .4s}
.eva-bench[data-s="running"] .bench__scan{opacity:1}
@keyframes benchScan{from{background-position:0 -220px}to{background-position:0 calc(100% + 220px)}}
.bench__caption{padding:6px 12px;font-size:12px;color:var(--dim-text);border-top:1px solid var(--line-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench-pill{position:fixed;z-index:9;top:calc(var(--safe-t) + 22px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:min(560px,70vw);
  padding:8px 16px;border-radius:var(--r-pill);background:var(--glass-solid);border:1px solid var(--line);color:var(--ice);font-size:13px;box-shadow:var(--glow-btn)}
.bench-pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench-pill i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--violet-bright);animation:benchPulse 1.2s ease-in-out infinite}
.eva.bench-open .bench-pill,.bench-pill[hidden]{display:none}
@media (max-width:899px){
  .eva-bench{top:calc(var(--safe-t) + 70px);left:10px;right:10px;bottom:calc(var(--safe-b) + 150px);grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);padding:12px;gap:10px}
  .bench__side{max-height:30vh} .bench__feed{display:none} .bench__plan{max-height:none}
  .bench__meta{display:none} .bench-pill{top:auto;bottom:calc(var(--safe-b) + 112px)}
  .bench__head{flex-wrap:wrap;row-gap:6px} .bench__title{flex:1;min-width:0} .bench__now{order:9;flex-basis:100%;font-size:14px}
}
/* full screen for a second monitor (or the desk screen): /stage */
.eva.stage-mode .eva-top,.eva.stage-mode .eva-bottom,.eva.stage-mode .eva-main{display:none}
.eva.stage-mode .eva-bench{inset:max(18px,var(--safe-t)) 18px 18px 18px;opacity:1;transform:none;visibility:visible}
.eva.stage-mode .bench__title{font-size:28px} .eva.stage-mode .bench__now{font-size:19px}

/* ===== Main: stage + rail ===== */
.eva-main{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 0px;gap:0;align-items:center;justify-content:center;
  max-width:1240px;width:100%;margin:0 auto;transition:grid-template-columns var(--dur-layout) var(--ease-out),gap var(--dur-layout) var(--ease-out)}
.eva.has-card .eva-main{grid-template-columns:minmax(0,1fr) var(--rail-w);gap:var(--s16)}
.eva-stage{display:flex;flex-direction:column;align-items:center;min-width:0;min-height:0;max-height:100%;--core:max(140px,min(460px,calc(100dvh - 330px)))}
.eva.has-card .eva-stage{--core:max(140px,min(400px,calc(100dvh - 340px)))}
.eva-main{overflow:hidden}
.eva-core{width:var(--core);height:var(--core);display:block;transition:width var(--dur-layout) var(--ease-out),height var(--dur-layout) var(--ease-out)}
.eva-caption{max-width:560px;min-height:3em;margin-top:var(--s3);text-align:center;font-size:20px;line-height:1.5;text-wrap:pretty;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.eva-caption.is-muted{color:var(--dim-text)}
.eva-caption__rest{color:var(--dim-text)}

.eva-rail{min-width:0;max-height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding:4px;margin:-4px;scrollbar-width:none}
.eva-rail::-webkit-scrollbar{display:none}
.eva:not(.has-card) .eva-rail{visibility:hidden}

/* ===== Bottom: history + dock + typebar ===== */
.eva-bottom{display:flex;flex-direction:column;align-items:center;gap:var(--s3);position:relative;z-index:3}
.eva-history-btn{height:32px;display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--dim-text);font-size:12px;letter-spacing:.04em}
.eva-history-btn:hover{color:var(--ice)}
.eva-history-btn svg.i{width:14px;height:14px}
.eva-typebar{width:min(560px,100%);display:none}
.eva.is-typing .eva-typebar{display:block}
.typefield{height:48px;display:flex;align-items:center;gap:var(--s2);padding:0 6px 0 18px;border-radius:var(--r-row);background:rgba(8,6,15,.7);border:1px solid rgba(168,85,247,.6);box-shadow:0 0 0 4px rgba(139,92,246,.14)}
.typefield input{flex:1;min-width:0;height:100%;background:none;border:0;color:var(--ice);font:15px var(--font-body);outline:none}
.typefield input::placeholder{color:var(--dim-text)}
.send-btn{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--violet-deep);border:1px solid var(--violet-bright);color:var(--ice)}
.send-btn svg.i{width:16px;height:16px}
.eva-dock{display:flex;align-items:center;gap:18px;padding:10px 12px;border-radius:var(--r-pill);background:rgba(18,13,36,.6);backdrop-filter:var(--blur-chrome);-webkit-backdrop-filter:var(--blur-chrome);border:1px solid var(--line)}
.dock-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:transparent;border:1px solid var(--line);color:var(--lilac);transition:background var(--dur-hover),box-shadow var(--dur-hover),border-color var(--dur-hover)}
.dock-btn:hover{box-shadow:0 0 18px rgba(168,85,247,.3)}
.dock-btn[aria-pressed="true"]{background:var(--tint-2);border-color:var(--line-strong)}
.dock-mic{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:var(--ice);
  background:radial-gradient(circle at 50% 30%,var(--violet),#5b21b6 75%);border:1px solid rgba(196,164,255,.5);box-shadow:var(--glow-mic);transition:box-shadow var(--dur-hover),transform var(--dur-hover)}
.dock-mic:hover{box-shadow:0 0 44px rgba(168,85,247,.6)}
.dock-mic:active{transform:scale(.96)}
.dock-mic svg.i{width:26px;height:26px}
.dock-mic[data-mode="listening"]{background:radial-gradient(circle at 50% 30%,var(--violet-bright),var(--violet-deep) 75%);border-color:rgba(196,164,255,.7);box-shadow:0 0 0 6px rgba(168,85,247,.14),0 0 36px rgba(168,85,247,.55)}
.dock-mic .ic-stop{display:none}
.dock-mic[data-mode="speaking"] .ic-mic{display:none}
.dock-mic[data-mode="speaking"] .ic-stop{display:block}

/* ===== Cards ===== */
.card{position:relative;padding:20px 24px 22px;border-radius:var(--r-card);background:var(--glass);backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);
  border:1px solid var(--line);box-shadow:var(--glow-card);overflow:hidden;overflow-wrap:anywhere;flex:none}
.card--accent{background:linear-gradient(180deg,rgba(52,32,98,.6),rgba(24,17,48,.6));border-color:rgba(196,164,255,.28)}
.card--proactive{border:1px solid transparent;box-shadow:var(--glow-alert);
  background:linear-gradient(180deg,rgba(38,16,58,.94),rgba(18,12,38,.94)) padding-box,linear-gradient(135deg,var(--magenta),var(--violet) 55%,rgba(196,164,255,.25)) border-box}
.card__head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.card__label{font:600 11px/1.2 var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--lilac)}
.card__meta{font-size:12px;color:var(--dim-text);white-space:nowrap}
.card__title{font-size:20px;font-weight:500;line-height:1.4;margin-top:var(--s3);text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__sub{font-size:14px;color:var(--dim-text);margin-top:var(--s1);line-height:1.5}

.btn{flex:1;min-height:46px;padding:0 var(--s4);border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);font-size:15px;font-weight:500;
  background:var(--tint);border:1px solid rgba(196,164,255,.22);color:var(--ice);transition:background var(--dur-hover),box-shadow var(--dur-hover)}

.btn--sm{flex:none;min-height:32px;padding:0 12px;font-size:12px;border-radius:var(--r-sm)}
.btn svg.i{width:16px;height:16px}

/* motion */
@keyframes eva-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.is-leaving{opacity:0;transform:translateX(8px);transition:opacity var(--dur-out) ease-in,transform var(--dur-out) ease-in}

.eva-panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:11;padding:calc(var(--safe-t) + 28px) calc(var(--safe-r) + 28px) calc(var(--safe-b) + 32px) 28px;
  background:var(--glass-solid);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--line);box-shadow:-30px 0 80px -30px rgba(139,92,246,.35);

.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:var(--r-md);background:rgba(8,6,15,.6);border:1px solid rgba(196,164,255,.14)}

.num{font:600 20px var(--font-display)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--offline);box-shadow:0 0 8px var(--offline);flex:none}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:5px 10px;border-radius:var(--r-pill);border:1px solid rgba(196,164,255,.2)}
.forge-box{display:flex;align-items:center;gap:var(--s3);padding:14px 16px;border-radius:var(--r-row);background:rgba(139,92,246,.12);border:1px solid rgba(196,164,255,.24)}

/* ===== Brain features (v0.2.5) ===== */
.seg.seg--sm{grid-template-columns:repeat(4,1fr)}

.eva.settings-open .eva-scrim{opacity:1;pointer-events:auto}

.rt-in:focus{outline:none;border-color:var(--line-strong)}
.rt-btn{height:36px;padding:0 12px;border-radius:10px;background:var(--tint);border:1px solid var(--line);color:var(--lilac);font-size:13px;white-space:nowrap}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const root = $('eva'), rail = $('evaRail'), caption = $('evaCaption'), canvas = $('evaCore');
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const emit = (name, detail) => window.dispatchEvent(new CustomEvent('eva:' + name, { detail }));

/* ---------- tiny DOM helper (always textContent, never innerHTML) ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
function icon(name, cls) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'i' + (cls ? ' ' + cls : ''));
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#i-' + name); s.append(u); return s;
}
const initials = n => String(n || '?').split(/[\s,]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');

/* ---------- clock ---------- */
function tickClock() {
  const d = new Date();
  $('evaTime').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  $('evaDate').textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long' });
}
tickClock(); setInterval(tickClock, 15000);

/* ---------- core canvas ---------- */
const core = { state: 'idle', level: null, raf: 0, last: 0 };
function sizeCanvas() {
  const dpr = Math.min(2, devicePixelRatio || 1), r = canvas.getBoundingClientRect();
  const s = Math.max(1, Math.round(r.width * dpr));
  if (canvas.width !== s) { canvas.width = s; canvas.height = s; }
}
new ResizeObserver(() => { sizeCanvas(); if (reduceMQ.matches) drawCore(3.2); }).observe(canvas);

function drawCore(t) {
  const x = canvas.getContext('2d'), W = canvas.width, m = W / 2, R = W * 0.19, TAU = Math.PI * 2, st = core.state;
  const rgba = (k, a) => `rgba(${k[0]},${k[1]},${k[2]},${a})`;
  const L = [196,164,255], V = [139,92,246], B = [168,85,247], M = [192,38,211], I = [239,234,255];
  const hot = st === 'thinking' || st === 'alert';
  const lvl = core.level;
  let r = R, halo = 0.3;
  if (st === 'idle') { const b = 0.5 + 0.5 * Math.sin(t * 1.1); r = R * (0.9 + 0.07 * b); halo = 0.16 + 0.14 * b; }
  if (st === 'listening') { r = R * 0.92; halo = 0.3; }
  if (st === 'thinking') { r = R * 0.68 + Math.sin(t * 6) * R * 0.015; halo = 0.3; }
  if (st === 'speaking') { const e = lvl != null ? lvl : Math.abs(Math.sin(t * 3.3) * Math.sin(t * 1.9 + 1)); r = R * (0.9 + 0.16 * e); halo = 0.24 + 0.24 * e; }
  if (st === 'alert') { const b = 0.5 + 0.5 * Math.sin(t * 2); r = R * (0.9 + 0.05 * b); halo = 0.28 + 0.14 * b; }
  x.clearRect(0, 0, W, W);
  x.globalCompositeOperation = 'lighter';
  let g = x.createRadialGradient(m, m, r * 0.4, m, m, m);
  g.addColorStop(0, rgba(hot ? M : B, halo)); g.addColorStop(0.45, rgba(V, halo * 0.35)); g.addColorStop(1, rgba(V, 0));
  x.fillStyle = g; x.fillRect(0, 0, W, W);
  x.lineWidth = W * 0.0025; x.strokeStyle = rgba(L, 0.16); x.beginPath(); x.arc(m, m, R * 1.6, 0, TAU); x.stroke();
  if (st === 'listening') {
    const amp = lvl != null ? 0.35 + lvl * 1.3 : 1;
    for (let k = 0; k < 2; k++) {
      x.beginPath();
      for (let i = 0; i <= 220; i++) {
        const a = i / 220 * TAU;
        const n = Math.sin(a * 6 + t * 4 + k) * 0.5 + Math.sin(a * 11 - t * 6.3) * 0.3 + Math.sin(a * 3 + t * 2.1) * 0.2;
        const rr = R * (1.3 + k * 0.12) + n * R * (k ? 0.08 : 0.16) * amp;
        const px = m + Math.cos(a) * rr, py = m + Math.sin(a) * rr;
        i ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.closePath(); x.lineWidth = W * (k ? 0.003 : 0.006); x.strokeStyle = rgba(k ? V : L, k ? 0.4 : 0.85); x.stroke();
    }
  }
  if (st === 'thinking') {
    x.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      const a0 = t * (1.6 + k * 0.7) * (k % 2 ? -1 : 1) + k * 2;
      x.beginPath(); x.arc(m, m, R * (1 + k * 0.16), a0, a0 + Math.PI * (0.5 + k * 0.2));
      x.lineWidth = W * 0.006; x.strokeStyle = rgba(k === 1 ? L : M, 0.8 - k * 0.15); x.stroke();
    }
  }
  if (st === 'speaking' || st === 'alert') {
    const C = st === 'alert' ? M : L, sp = st === 'alert' ? 0.35 : 0.7;
    for (let i = 0; i < 3; i++) {
      const p = (t * sp + i / 3) % 1;
      x.beginPath(); x.arc(m, m, r * (1.1 + p * 1.3), 0, TAU);
      x.lineWidth = W * (0.004 * (1 - p) + 0.001); x.strokeStyle = rgba(C, (1 - p) * 0.5); x.stroke();
    }
  }
  g = x.createRadialGradient(m, m - r * 0.15, 0, m, m, r * 1.15);
  g.addColorStop(0, rgba(I, 0.95)); g.addColorStop(0.25, rgba(L, 0.85)); g.addColorStop(0.6, rgba(hot ? M : B, 0.7)); g.addColorStop(1, rgba(V, 0));
  x.fillStyle = g; x.beginPath(); x.arc(m, m, r * 1.15, 0, TAU); x.fill();
  x.lineWidth = W * 0.003; x.strokeStyle = rgba(I, 0.35); x.beginPath(); x.arc(m, m, r * 0.78, 0, TAU); x.stroke();
  x.globalCompositeOperation = 'source-over';
}
function loop(ts) {
  if (ts - core.last > 16) { core.last = ts; drawCore(ts / 1000); }
  core.raf = requestAnimationFrame(loop);
}
function startCore() {
  cancelAnimationFrame(core.raf); sizeCanvas();
  if (reduceMQ.matches) drawCore(3.2); else core.raf = requestAnimationFrame(loop);
}
reduceMQ.addEventListener('change', startCore);
document.addEventListener('visibilitychange', () => document.hidden ? cancelAnimationFrame(core.raf) : startCore());

function setState(s) {
  core.state = s;
  const mic = $('evaMic');
  mic.dataset.mode = s;
  mic.setAttribute('aria-label', s === 'speaking' ? 'Stop' : s === 'listening' ? 'Stop listening' : 'Talk');
  syncAlert();
  if (reduceMQ.matches) drawCore(3.2);
}

/* ---------- caption ---------- */
function setCaption(text, spoken) {
  caption.textContent = '';
  caption.classList.toggle('is-muted', false);
  if (!text) return;
  if (typeof spoken === 'number' && spoken < text.length) {
    caption.append(h('span', null, text.slice(0, spoken)), h('span', { class: 'eva-caption__rest' }, text.slice(spoken)));
  } else caption.textContent = text;
}
function setHint(text) { caption.textContent = text || ''; caption.classList.add('is-muted'); }

/* ---------- cards ---------- */
const RULES = { maxCollapsed: 2, autoCollapseMs: 45000 };
const WAITS = new Set(['confirm', 'alert', 'forge']);  // these wait for an answer
let cards = [], seq = 0;

const META = {
  weather: ['cloud', 'Weather'], calendar: ['cal', 'Calendar'], email: ['mail', 'Email'], confirm: ['cal', 'Confirm'],
  nowplaying: ['music', 'Now playing'], note: ['note', 'Note'], vision: ['eye', 'Vision'], reminder: ['bell', 'Reminder'],
  alert: ['bell', 'Alert'], forge: ['wrench', 'FORGE draft'], model: ['eye', 'Model'],
  gallery: ['eye', 'Pictures'], media: ['eye', 'Showing'], project: ['note', 'Project']
};

function head(label, meta, proactive) {
  return h('div', { class: 'card__head' },
    proactive ? h('span', { class: 'tag-proactive' }, icon('bell'), 'Started by E.V.A.') : h('span', { class: 'card__label' }, label),
    meta ? h('span', { class: 'card__meta' }, meta) : null);
}
function actions(c, list) {
  return h('div', { class: 'card__actions' }, list.map(([action, label, primary, ic]) =>
    h('button', { class: 'btn' + (primary ? ' btn--primary' : ''), onclick: () => answer(c, action) }, ic ? icon(ic) : null, label)));
}
function minutesUntil(hhmm) {
  const [H, M] = String(hhmm).split(':').map(Number); if (isNaN(H)) return null;
  const now = new Date(), t = new Date(); t.setHours(H, M || 0, 0, 0);
  return Math.round((t - now) / 60000);
}

const RENDER = {
  weather(d) {
    const temp = d.temp_c != null ? `${Math.round(d.temp_c)}°` : `${Math.round(d.low_c)}° to ${Math.round(d.high_c)}°`;
    const rain = d.rain_chance_pct != null ? `${d.rain_chance_pct}%` : d.rain_mm != null ? `${d.rain_mm} mm` : null;
    const stats = [['Rain', rain], ['Wind', d.wind_kmh != null ? `${d.wind_kmh} km/h` : null], ['Feels like', d.feels_like_c != null ? `${Math.round(d.feels_like_c)}°` : null]].filter(s => s[1]);
    return [head('Weather', d.source),
      h('div', { class: 'card__sub', style: 'margin-top:16px' }, [d.city, d.when].filter(Boolean).join(', ')),
      h('div', { class: 'card__big' }, temp),
      d.conditions ? h('div', { style: 'font-size:17px;margin-top:2px' }, d.conditions) : null,
      stats.length ? h('div', { class: 'card__stats' }, stats.map(([k, v]) => h('div', null, h('div', { class: 'stat__k' }, k), h('div', { class: 'stat__v' }, v)))) : null,
      d.note ? h('div', { class: 'card__note' }, d.note) : null];
  },
  calendar(d) {
    const ev = d.events || [];
    if (ev.length === 1 || /up next/i.test(d.title || '')) {       // "Up next" variant
      const e = ev[0] || {}, mins = e.minutes ?? minutesUntil(e.time);
      return { accent: true, kids: [h('div', { class: 'card__head' }, h('span', { class: 'card__label' }, d.title || 'Up next'),
          mins != null && mins >= 0 ? h('span', { class: 'pill' }, `in ${mins} min`) : null),
        h('div', { class: 'card__title', style: '-webkit-line-clamp:1' }, e.title),
        h('div', { class: 'card__sub' }, [e.day, e.time, e.where].filter(Boolean).join(' · '))] };
    }
    const shown = ev.slice(0, 5), more = ev.length - shown.length;
    return [head(d.title || 'Still today', `${ev.length} item${ev.length === 1 ? '' : 's'}`),
      h('div', { class: 'list' }, shown.map((e, i) => h('div', { class: 'list__row' + (i === 0 ? ' is-next' : '') },
        h('span', { class: 'list__time' }, e.time || e.day || ''), h('span', { class: 'list__title', title: e.title }, e.title)))),
      more > 0 ? h('div', { class: 'list__more' }, `${more} more`) : null];
  },
  email(d) {
    const em = d.emails || [], shown = em.slice(0, 5);
    return [head('Email', d.source),
      h('div', { style: 'font-size:20px;font-weight:500;margin-top:10px' }, d.title || 'Worth your attention'),
      h('div', { style: 'margin-top:8px' }, shown.map(e => h('div', { class: 'mail' },
        h('span', { class: 'mail__avatar', 'aria-hidden': 'true' }, initials(e.from)),
        h('div', { style: 'min-width:0' }, h('div', { class: 'mail__from' }, e.from), h('div', { class: 'mail__subject' }, e.subject),
          (e.reason || e.snippet) ? h('div', { class: 'mail__reason' }, e.reason || e.snippet) : null)))),
      d.others ? h('div', { class: 'card__foot' }, `${d.others} others can wait.`) : null];
  },
  confirm(d, c) {
    return [head(d.title || 'Just to confirm', d.source),
      h('div', { class: 'card__title', style: '-webkit-line-clamp:3' }, d.text),
      actions(c, [['confirm', 'Go ahead', true], ['cancel', 'Cancel']]),
      h('div', { class: 'card__hint' }, 'Or just say "go ahead"')];
  },
  nowplaying(d) { return [head('Now playing'), h('div', { class: 'card__title' }, d.what)]; },
  note(d) { const out = [head(d.title || 'Note'), h('div', { class: 'card__text' }, d.text)];
    const links = (d.links || []).filter(l => /^https?:\/\//.test(l.url || '')).slice(0, 12);      // v0.8: links she found
    if (links.length) out.push(h('div', { class: 'card__links' }, ...links.map(l => h('a', { href: l.url, target: '_blank', rel: 'noopener noreferrer' }, l.title || l.url.replace(/^https?:\/\/(www\.)?/, '').slice(0, 60)))));
    return out; },
  vision(d) { return [head(d.title || 'Vision'), h('div', { class: 'card__text' }, d.text)]; },
  project(d) {                                         // v0.6: a project: decided, open, parts
    const sec = (title, kids) => kids && kids.length ? h('div', { class: 'proj__sec' }, h('div', { class: 'bench__label' }, title), kids) : null;
    const eur = v => v == null || v === '' ? '' : `\u20ac${Number(v).toFixed(Number(v) % 1 ? 2 : 0)}`;
    const parts = (d.parts || []).map(x => h('div', { class: 'proj__part' },
      h('span', { class: 'proj__pname' }, x.link ? h('a', { href: x.link, target: '_blank', rel: 'noopener noreferrer' }, x.name) : x.name,
        x.why ? h('small', null, x.why) : null),
      h('span', { class: 'proj__q' }, x.qty > 1 ? `\u00d7${x.qty}` : ''),
      h('span', { class: 'proj__st', 'data-s': x.status || 'idea' }, x.status || 'idea'),
      h('span', { class: 'proj__eur' }, eur(x.price_eur))));
    return [head(d.name || 'Project', d.total_eur ? `about ${eur(d.total_eur)}` : (d.tasks ? `${d.tasks} tasks` : '')),
      d.goal ? h('div', { class: 'card__sub' }, d.goal) : null,
      sec('Decided', (d.decisions || []).map(t => h('div', { class: 'proj__li' }, t))),
      sec('Open questions', (d.questions || []).map(q => h('div', { class: 'proj__li proj__li--q' }, h('b', null, String(q.n)), ' ', q.text))),
      sec('Parts', parts.length ? [...parts, h('div', { class: 'proj__part proj__total' }, h('span', null, 'Total'), h('span'), h('span'), h('span', { class: 'proj__eur' }, eur(d.total_eur)))] : null),

  if (window.EvaNative) sendCtl({ type: 'device', kind: 'android', caps: ['alarm', 'timer', 'reply', 'volume', 'record', 'ring'] });   // v0.3 9c; reply = messages (v0.3.2)
  sttMode = ev.engine === 'server' ? 'server' : 'browser'; sttReason = ev.reason || '';

  } else {
    micRelease();
    if (sttReason) console.info('E.V.A. listening: browser speech recognition (' + sttReason + ')');

}
function onListen(ev) {
  if (ev.state === 'speech') { setState('listening'); E.setHint('Listening...'); micTouch(); }
  else if (ev.state === 'end') { setState('thinking'); E.setLevel(null); }
  else if (ev.state === 'noise' || ev.state === 'timeout') {

  }

/* ---------------- speech recognition: tap, follow-up, wake word ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, fol = null, wakeRec = null;

  if (window.isSecureContext !== false) return false;
  caption("I can't use the microphone on this page, sir. It needs a secure connection.");
  E.setHint('Open the https:// link from E.V.A.\'s terminal to talk here');
  setState('idle');
  return true;
}
function listen(windowMs) {
  if (micBlocked()) return;
  if (!SR) { E.setHint('Voice input needs Chrome or Edge. Type instead.'); return; }
  stopListening(); const r = recognizer(false); let fin = '';
  if (windowMs) fol = r; else rec = r;
  setState('listening'); E.setHint(windowMs ? 'Go on...' : 'Listening...');
  const timer = windowMs ? setTimeout(() => { try { r.stop(); } catch (_) {} }, windowMs) : null;
  r.onresult = e => { let itm = ''; for (let i = e.resultIndex; i < e.results.length; i++) {
    const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else itm += t; } caption(fin || itm); };
  r.onerror = () => {};
  r.onend = () => { clearTimeout(timer); if (fol === r) fol = null; if (rec === r) rec = null;
    const done = fin.trim(); if (done) send(done, true); else { setState('idle'); idleHint(); if (wakeMode) ensureWake(); } };
  try { r.start(); } catch (_) { setState('idle'); }
}
const FOLLOW_MS = 12000;                                       // after each answer: time to start talking
let skipFollow = false, followMs = FOLLOW_MS;
const followUp = () => {
  if (skipFollow) { skipFollow = false; setState('idle'); idleHint(); if (wakeMode) ensureWake(); return; }
  const ms = followMs; followMs = FOLLOW_MS;
  return (sttMode === 'server' && micOn()) ? armServer(ms, 'Go on...') : listen(ms);
};
function ensureWake() { if (wakeMode && SR && !wakeRec && !isSpeaking() && state !== 'listening') startWake(); }

    if (!armed && /\b(eva|eve|ava|hey eva)\b/.test(t)) {
      const cmd = t.replace(/.*\b(hey eva|eva|eve|ava)\b[\s,]*/, '').trim();
      if (last.isFinal && cmd.length > 2) { send(cmd, true); return; }
      armed = true; caption('Yes, sir?'); playWake(followUp);
    } else if (armed && last.isFinal) { const cmd = t.replace(/\b(eva|eve|ava|hey eva)\b/, '').trim(); if (cmd.length > 2) { armed = false; send(cmd, true); } } };
  wakeRec.onerror = () => {};
  wakeRec.onend = () => { wakeRec = null; setTimeout(ensureWake, 400); };
  try { wakeRec.start(); } catch (_) { wakeRec = null; }
}

/* ---------------- UI events -> server ---------------- */
addEventListener('eva:mic', () => {
  if (state === 'speaking' || state === 'thinking' || isSpeaking()) { bargeIn(); setState('idle'); idleHint(); }
  else if (state === 'listening') { if (sttMode === 'server') sendCtl({ type: 'listen', arm: 0 }); stopListening(); setState('idle'); idleHint(); }
  else { bargeIn(); if (sttMode === 'server') tapServer(); else listen(0); }
});
addEventListener('eva:text', e => send((e.detail && e.detail.text || '').trim(), false));
// v0.3 9b, the phone overlay: the lock state, and the words you said right after "Eva" (recorded by the wake
// service before this page could open its own mic), sent once the socket is up.
let deviceState = null, pendingPcm = null;
function flushDevice() {
  if (!(ws && ws.readyState === 1)) return;
  if (deviceState) ws.send(JSON.stringify({ type: 'device_state', ...deviceState }));
  if (pendingPcm !== null) {
    const p = pendingPcm; pendingPcm = null; lastWasVoice = true;
    if (p.text !== undefined) {                                  // checked and transcribed by your PC already
      if (p.text) { setState('thinking'); ws.send(JSON.stringify({ type: 'pcm_command', text: p.text })); }
      else dispatchEvent(new CustomEvent('eva:mic'));            // just "Eva": listen now
    } else if (p.pcm) { setState('thinking'); ws.send(JSON.stringify({ type: 'pcm_command', pcm: p.pcm })); }
    else dispatchEvent(new CustomEvent('eva:mic'));
  }
}
addEventListener('eva:device-state', e => { deviceState = Object.assign({}, deviceState, e.detail || {}); flushDevice(); });
addEventListener('eva:pcm', e => { pendingPcm = e.detail || {}; flushDevice(); });
addEventListener('eva:wake', e => { wakeMode = !!(e.detail && e.detail.on);
  try { localStorage.setItem('eva.wake', wakeMode ? '1' : '0'); } catch (_) {}
  if (sttMode === 'server') {
    if (wakeMode) micStart().then(ok => { if (ok) sendCtl({ type: 'listen', wake: true }); else startWake(); });
    else { sendCtl({ type: 'listen', wake: false, arm: 0 }); micTouch(); setState('idle'); }
  } else if (wakeMode) startWake(); else { stopListening(); setState('idle'); }
  idleHint(); });
addEventListener('eva:action', e => {
  const a = e.detail && e.detail.action;
  if (a === 'confirm' || a === 'install') send('yes', false);
  else if (a === 'cancel' || a === 'discard') send('no', false);
  else if (a === 'snooze') send('snooze it', false);
  if (a !== 'dismiss' && state === 'alert') setState('idle');
});
async function setBrain(body) {                                // v0.2.5: a switch, not a chat message
  try { await fetch('/api/brain', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  catch (_) {}
  refreshStatus();
}
addEventListener('eva:brain-mode', e => setBrain({ mode: e.detail.mode }));
addEventListener('eva:brain-feature', e => setBrain({ feature: e.detail.feature, mode: e.detail.mode }));
addEventListener('eva:phone-setting', async e => {
  try { await fetch('/api/phone', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(e.detail || {}) }); } catch (_) {}
  refreshStatus(); });
addEventListener('eva:device-result', e => sendCtl({ type: 'device_result', ...(e.detail || {}) }));
addEventListener('eva:conversation', async e => {
  try { await fetch('/api/conversation', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: !!e.detail.on }) }); }
  catch (_) {}
  refreshStatus();

addEventListener('eva:chat-open', e => { stopAudio(); sendCtl({ type: 'chat_open', id: e.detail.id }); });
addEventListener('eva:chat-new', () => { stopAudio(); sendCtl({ type: 'chat_new' }); });
addEventListener('eva:forge-review', () => send('which skills are waiting', false));

/* ---------------- Routines panel (v0.2.5): reminders, routines, moods, shopping list ---------------- */
const RT = { tab: 'week', data: null, editing: null };
const DAYS = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
/*EL-START*/
function el(tag, props, ...kids) {                             // textContent only, never innerHTML
  const n = document.createElement(tag);
  for (const k in props || {}) { const v = props[k]; if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k.startsWith('on')) n[k] = v; else if (k === 'value') n.value = v;
    else if (k === 'checked') n.checked = !!v; else n.setAttribute(k, v === true ? '' : v); }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
/*EL-END*/
async function api(method, path, body) {
  const r = await fetch('/api/routines' + path, { method, headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined });
  let j = {}; try { j = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));

}
async function rtLoad() { try { RT.data = await api('GET', ''); } catch (e) { RT.data = { error: e.message }; } rtRender(); }
async function rtDo(fn) { try { await fn(); } catch (e) { alert('E.V.A.: ' + e.message); } await rtLoad(); }
function whenText(iso) {
  const d = new Date(iso), now = new Date(), tm = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const days = Math.round((new Date(d.toDateString()) - new Date(now.toDateString())) / 864e5);
  return (days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' })) + ' ' + tm;
}
function localIso(d) { const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; }
function dayPicker(sel) {
  return el('div', { class: 'rt-days' }, DAYS.map((d, i) => el('button', { type: 'button', 'aria-pressed': String(sel.has(i)),
    onclick: e => { sel.has(i) ? sel.delete(i) : sel.add(i); e.currentTarget.setAttribute('aria-pressed', String(sel.has(i))); } }, d)));
}
function rtWeek(d) {
  return d.week.map(day => [el('div', { class: 'rt-day' }, day.label),
    day.items.length ? day.items.map(i => el('div', { class: 'rt-row' },
      el('span', { class: 'rt-row__main' }, el('b', null, i.time), '  ', i.text),
      el('span', { class: 'muted', style: 'font-size:12px' }, i.kind))) : el('div', { class: 'rt-empty' }, 'Nothing planned.')]);
}
function rtReminders(d) {
  const text = el('input', { class: 'rt-in', placeholder: 'Remind me to...', maxlength: '300' });
  const due = el('input', { class: 'rt-in', type: 'datetime-local', value: localIso(new Date(Date.now() + 36e5)) });
  const form = el('form', { class: 'rt-form', onsubmit: e => { e.preventDefault(); if (!text.value.trim()) return;
    rtDo(() => api('POST', '/reminders', { text: text.value, due: due.value })); } }, text, due, el('button', { class: 'rt-btn' }, 'Add'));
  const rows = d.reminders.map(r => {
    if (RT.editing === r.id) {

      return el('form', { class: 'rt-form', onsubmit: e => { e.preventDefault(); RT.editing = null;
        rtDo(() => api('PATCH', '/reminders/' + r.id, { text: t.value, due: w.value })); } }, t, w,
        el('button', { class: 'rt-btn' }, 'Save'), el('button', { class: 'rt-btn', type: 'button', onclick: () => { RT.editing = null; rtRender(); } }, 'Cancel'));
    }
    return el('div', { class: 'rt-row' }, el('span', { class: 'rt-row__main' }, r.text, el('span', { class: 'rt-row__sub' }, whenText(r.due))),
      el('button', { class: 'rt-btn', onclick: () => { RT.editing = r.id; rtRender(); } }, 'Edit'),
      el('button', { class: 'rt-btn is-danger', onclick: () => confirm(`Delete "${r.text}"?`) && rtDo(() => api('DELETE', '/reminders/' + r.id)) }, 'Delete'));
  });

}
function rtRoutines(d) {
  const sel = new Set([0, 1, 2, 3, 4]);
  const text = el('input', { class: 'rt-in', placeholder: 'What to remind you of', maxlength: '300' });
  const time = el('input', { class: 'rt-in', type: 'time', value: '08:00', style: 'flex:0 0 110px' });
  const action = el('select', { class: 'rt-in', style: 'flex:0 0 130px' }, [['remind', 'Reminder'], ['briefing', 'Briefing'],
    ['agenda', 'Agenda'], ['email', 'Important email']].map(([v, l]) => el('option', { value: v }, l)));
  const form = el('form', { class: 'rt-form', onsubmit: e => { e.preventDefault();
    rtDo(() => api('POST', '/routines', { text: text.value, days: [...sel], time: time.value, action: action.value })); } },
    action, text, time, dayPicker(sel), el('button', { class: 'rt-btn' }, 'Add routine'));
  const rows = d.routines.map(r => {
    if (RT.editing === r.id) {
      const s2 = new Set(r.days), t = el('input', { class: 'rt-in', value: r.text }), tm = el('input', { class: 'rt-in', type: 'time', value: r.time, style: 'flex:0 0 110px' });
      return el('form', { class: 'rt-form', onsubmit: e => { e.preventDefault(); RT.editing = null;
        rtDo(() => api('PATCH', '/routines/' + r.id, { text: t.value, time: tm.value, days: [...s2] })); } }, t, tm, dayPicker(s2),
        el('button', { class: 'rt-btn' }, 'Save'), el('button', { class: 'rt-btn', type: 'button', onclick: () => { RT.editing = null; rtRender(); } }, 'Cancel'));
    }
    return el('div', { class: 'rt-row' + (r.paused ? ' is-paused' : '') },
      el('span', { class: 'rt-row__main' }, r.describe, r.paused ? el('span', { class: 'rt-row__sub' }, 'Paused') : null),
      el('button', { class: 'rt-btn', onclick: () => rtDo(() => api('PATCH', '/routines/' + r.id, { paused: !r.paused })) }, r.paused ? 'Resume' : 'Pause'),
      el('button', { class: 'rt-btn', onclick: () => { RT.editing = r.id; rtRender(); } }, 'Edit'),
      el('button', { class: 'rt-btn is-danger', onclick: () => confirm('Delete this routine?') && rtDo(() => api('DELETE', '/routines/' + r.id)) }, 'Delete'));
  });
  return [form, rows.length ? rows : el('div', { class: 'rt-empty' }, 'No routines yet. Try "every weekday at 8, brief me".')];
}
function rtMoods(d) {
  const name = el('input', { class: 'rt-in', placeholder: 'Mood name', maxlength: '40' });
  const color = el('input', { class: 'rt-in', placeholder: 'Colour (e.g. cyan, warm white)', maxlength: '40' });
  const bright = el('input', { class: 'rt-in', type: 'number', min: '1', max: '100', value: '60', style: 'flex:0 0 80px', title: 'Brightness %' });
  const playlist = el('input', { class: 'rt-in', placeholder: 'Playlist (optional)', maxlength: '120' });
  const fill = m => { name.value = m.name; color.value = m.color || (m.white != null ? 'white' : ''); bright.value = m.brightness || 60; playlist.value = m.playlist || ''; name.focus(); };
  const form = el('form', { class: 'rt-form', onsubmit: e => { e.preventDefault(); if (!name.value.trim()) return;
    rtDo(() => api('POST', '/moods', { name: name.value, color: color.value && color.value !== 'white' ? color.value : null,
      brightness: +bright.value || 60, playlist: playlist.value })); } }, name, color, bright, playlist, el('button', { class: 'rt-btn' }, 'Save mood'));
  const rows = d.moods.map(m => el('div', { class: 'rt-row' },
    el('span', { class: 'rt-row__main' }, m.name, el('span', { class: 'rt-row__sub' },
      [m.color || (m.white != null ? 'white' : ''), (m.brightness || '') + '%', m.playlist].filter(Boolean).join(' · ') + (m.edited && m.builtin ? ' · edited' : ''))),
    el('button', { class: 'rt-btn', onclick: () => fill(m) }, 'Edit'),
    (!m.builtin || m.edited) ? el('button', { class: 'rt-btn is-danger', onclick: () => confirm(m.builtin ? `Reset "${m.name}" to its default?` : `Delete "${m.name}"?`)
      && rtDo(() => api('DELETE', '/moods/' + encodeURIComponent(m.name))) }, m.builtin ? 'Reset' : 'Delete') : null));
  return [form, rows];
}
function rtShopping(d) {
  const inp = el('input', { class: 'rt-in', placeholder: 'Milk, eggs and bread', maxlength: '500' });
  const form = el('form', { class: 'rt-form', onsubmit: e => { e.preventDefault(); if (!inp.value.trim()) return;
    rtDo(() => api('POST', '/shopping', { items: inp.value })); } }, inp, el('button', { class: 'rt-btn' }, 'Add'));
  const rows = d.shopping.map(i => el('div', { class: 'rt-row' + (i.done ? ' is-done' : '') },

  const body = !d ? el('div', { class: 'rt-empty' }, 'Loading...') : d.error ? el('div', { class: 'rt-empty' }, 'Could not load: ' + d.error)
    : { week: rtWeek, reminders: rtReminders, routines: rtRoutines, moods: rtMoods, shopping: rtShopping }[RT.tab](d);

    el('div', { class: 'seg rt-tabs', role: 'tablist' }, tabs.map(([k, l]) => el('button', { 'aria-pressed': String(RT.tab === k),
      onclick: () => { RT.tab = k; RT.editing = null; rtRender(); } }, l))),

addEventListener('eva:routines', () => { rtRender(); rtLoad(); });
function rtOpen() { return document.getElementById('eva') && document.getElementById('eva').classList.contains('routines-open'); }

/* ---------------- status panel ---------------- */

    const s = await (await fetch('/api/status')).json();
    E.setStatus({
      voice: { name: s.voice === 'kokoro' ? 'Kokoro' : 'Browser voice',
        detail: (s.voice === 'kokoro' ? 'local' : 'fallback') + (sttMode === 'server' ? ' · hears you locally' : ' · browser listening') },

}
setInterval(() => { if (connected) refreshStatus(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
connect();
})();
