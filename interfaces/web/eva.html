<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08060f">
<title>E.V.A.</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* ===== Tokens ===== */
:root{
  --void-0:#08060f; --void-1:#0d0a1c; --void-2:#140f2b;
  --violet:#8b5cf6; --violet-bright:#a855f7; --violet-deep:#6d28d9; --violet-deep-hover:#7c3aed;
  --magenta:#c026d3; --lilac:#c4a4ff; --ice:#efeaff;
  --dim:#7a7196;        /* decorative only, below AA for small text */
  --dim-text:#968dba;   /* secondary text, AA on void */
  --offline:#f0506e;
  --glass:linear-gradient(180deg,rgba(34,24,66,.55),rgba(18,13,36,.55));
  --glass-solid:rgba(16,11,32,.86);
  --glass-row:rgba(24,17,48,.5);
  --line:rgba(196,164,255,.18); --line-soft:rgba(196,164,255,.08); --line-strong:rgba(196,164,255,.4);
  --tint:rgba(196,164,255,.06); --tint-2:rgba(139,92,246,.16);
  --glow-card:0 18px 60px -20px rgba(139,92,246,.4);
  --glow-btn:0 0 24px rgba(168,85,247,.35);
  --glow-mic:0 0 32px rgba(168,85,247,.45);
  --glow-alert:0 0 48px -8px rgba(192,38,211,.45);
  --blur-card:blur(20px) saturate(140%); --blur-chrome:blur(18px);
  --font-display:'Chakra Petch',sans-serif; --font-body:'Inter',system-ui,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px; --s16:64px;
  --r-xs:6px; --r-sm:10px; --r-md:12px; --r-row:14px; --r-card:20px; --r-panel:24px; --r-pill:999px;
  --dur-in:360ms; --dur-out:240ms; --dur-layout:420ms; --dur-hover:160ms;
  --ease-out:cubic-bezier(.2,.7,.2,1);
  --rail-w:440px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--void-0);color:var(--ice);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--violet-bright);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== App shell ===== */
.eva{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:calc(var(--safe-t) + 20px) calc(var(--safe-r) + 32px) calc(var(--safe-b) + 28px) calc(var(--safe-l) + 32px);
  background:radial-gradient(ellipse 70% 60% at 50% 42%,var(--void-2) 0%,var(--void-1) 45%,var(--void-0) 100%)}
.eva::before{content:"";position:absolute;inset:0 0 auto 0;height:30vh;pointer-events:none;opacity:0;transition:opacity var(--dur-layout) var(--ease-out);
  background:radial-gradient(ellipse 60% 100% at 50% 0%,rgba(192,38,211,.18),transparent 70%)}
.eva::after{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;pointer-events:none;opacity:0;transition:opacity var(--dur-layout) var(--ease-out);
  background:linear-gradient(90deg,transparent,var(--magenta) 30%,var(--violet-bright) 70%,transparent)}
.eva.is-alert::before,.eva.is-alert::after{opacity:1}

.eva-top{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);position:relative;z-index:2;min-height:44px}
.eva-conn{display:flex;align-items:center;gap:10px}
.eva-conn__dot{width:8px;height:8px;border-radius:50%;background:var(--offline);box-shadow:0 0 12px var(--offline);transition:background var(--dur-hover),box-shadow var(--dur-hover)}
.eva-conn[data-live="true"] .eva-conn__dot{background:var(--violet-bright);box-shadow:0 0 12px var(--violet-bright)}
.eva-brand{font:600 13px/1 var(--font-display);letter-spacing:.28em;color:var(--lilac)}
.eva-conn__text{font-size:12px;color:var(--dim-text)}
.eva-conn[data-live="true"] .eva-conn__text{display:none}
.eva-top__right{display:flex;align-items:center;gap:18px}
.eva-clock{text-align:right}
.eva-clock__time{font:500 22px/1.1 var(--font-display);letter-spacing:.06em}
.eva-clock__date{font-size:12px;color:var(--dim-text);margin-top:2px}
.icon-btn{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--tint);border:1px solid var(--line);color:var(--lilac);transition:background var(--dur-hover),box-shadow var(--dur-hover)}
.icon-btn:hover{background:rgba(196,164,255,.12);box-shadow:0 0 18px rgba(168,85,247,.25)}

/* ===== Main: stage + rail ===== */
.eva-main{position:relative;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 0px;gap:0;align-items:center;justify-content:center;
  max-width:1240px;width:100%;margin:0 auto;transition:grid-template-columns var(--dur-layout) var(--ease-out),gap var(--dur-layout) var(--ease-out)}
.eva.has-card .eva-main{grid-template-columns:minmax(0,1fr) var(--rail-w);gap:var(--s16)}
.eva-stage{display:flex;flex-direction:column;align-items:center;min-width:0;min-height:0;max-height:100%;--core:max(140px,min(460px,calc(100dvh - 330px)))}
.eva.has-card .eva-stage{--core:max(140px,min(400px,calc(100dvh - 340px)))}
.eva-main{overflow:hidden}
.eva-core{width:var(--core);height:var(--core);display:block;transition:width var(--dur-layout) var(--ease-out),height var(--dur-layout) var(--ease-out)}
.eva-caption{max-width:560px;min-height:3em;margin-top:var(--s3);text-align:center;font-size:20px;line-height:1.5;text-wrap:pretty;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.eva-caption.is-muted{color:var(--dim-text)}
.eva-caption__rest{color:var(--dim-text)}

.eva-rail{min-width:0;max-height:100%;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:10px;padding:4px;margin:-4px;scrollbar-width:none}
.eva-rail::-webkit-scrollbar{display:none}
.eva:not(.has-card) .eva-rail{visibility:hidden}

/* ===== Bottom: history + dock + typebar ===== */
.eva-bottom{display:flex;flex-direction:column;align-items:center;gap:var(--s3);position:relative;z-index:3}
.eva-history-btn{height:32px;display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--dim-text);font-size:12px;letter-spacing:.04em}
.eva-history-btn:hover{color:var(--ice)}
.eva-history-btn svg.i{width:14px;height:14px}
.eva-typebar{width:min(560px,100%);display:none}
.eva.is-typing .eva-typebar{display:block}
.typefield{height:48px;display:flex;align-items:center;gap:var(--s2);padding:0 6px 0 18px;border-radius:var(--r-row);background:rgba(8,6,15,.7);border:1px solid rgba(168,85,247,.6);box-shadow:0 0 0 4px rgba(139,92,246,.14)}
.typefield input{flex:1;min-width:0;height:100%;background:none;border:0;color:var(--ice);font:15px var(--font-body);outline:none}
.typefield input::placeholder{color:var(--dim-text)}
.send-btn{width:36px;height:36px;border-radius:var(--r-sm);display:grid;place-items:center;background:var(--violet-deep);border:1px solid var(--violet-bright);color:var(--ice)}
.send-btn svg.i{width:16px;height:16px}
.eva-dock{display:flex;align-items:center;gap:18px;padding:10px 12px;border-radius:var(--r-pill);background:rgba(18,13,36,.6);backdrop-filter:var(--blur-chrome);-webkit-backdrop-filter:var(--blur-chrome);border:1px solid var(--line)}
.dock-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:transparent;border:1px solid var(--line);color:var(--lilac);transition:background var(--dur-hover),box-shadow var(--dur-hover),border-color var(--dur-hover)}
.dock-btn:hover{box-shadow:0 0 18px rgba(168,85,247,.3)}
.dock-btn[aria-pressed="true"]{background:var(--tint-2);border-color:var(--line-strong)}
.dock-mic{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:var(--ice);
  background:radial-gradient(circle at 50% 30%,var(--violet),#5b21b6 75%);border:1px solid rgba(196,164,255,.5);box-shadow:var(--glow-mic);transition:box-shadow var(--dur-hover),transform var(--dur-hover)}
.dock-mic:hover{box-shadow:0 0 44px rgba(168,85,247,.6)}
.dock-mic:active{transform:scale(.96)}
.dock-mic svg.i{width:26px;height:26px}
.dock-mic[data-mode="listening"]{background:radial-gradient(circle at 50% 30%,var(--violet-bright),var(--violet-deep) 75%);border-color:rgba(196,164,255,.7);box-shadow:0 0 0 6px rgba(168,85,247,.14),0 0 36px rgba(168,85,247,.55)}
.dock-mic .ic-stop{display:none}
.dock-mic[data-mode="speaking"] .ic-mic{display:none}
.dock-mic[data-mode="speaking"] .ic-stop{display:block}

/* ===== Cards ===== */
.card{position:relative;padding:20px 24px 22px;border-radius:var(--r-card);background:var(--glass);backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);
  border:1px solid var(--line);box-shadow:var(--glow-card);overflow:hidden;overflow-wrap:anywhere;flex:none}
.card--accent{background:linear-gradient(180deg,rgba(52,32,98,.6),rgba(24,17,48,.6));border-color:rgba(196,164,255,.28)}
.card--proactive{border:1px solid transparent;box-shadow:var(--glow-alert);
  background:linear-gradient(180deg,rgba(38,16,58,.94),rgba(18,12,38,.94)) padding-box,linear-gradient(135deg,var(--magenta),var(--violet) 55%,rgba(196,164,255,.25)) border-box}
.card__head{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.card__label{font:600 11px/1.2 var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--lilac)}
.card__meta{font-size:12px;color:var(--dim-text);white-space:nowrap}
.card__title{font-size:20px;font-weight:500;line-height:1.4;margin-top:var(--s3);text-wrap:pretty;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card__sub{font-size:14px;color:var(--dim-text);margin-top:var(--s1);line-height:1.5}
.card__text{font-size:15px;line-height:1.5;margin-top:var(--s2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card__big{font:600 48px/1.1 var(--font-display);letter-spacing:-.01em;margin-top:2px}
.card__stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid rgba(196,164,255,.12)}
.stat__k{font-size:12px;color:var(--dim-text)}
.stat__v{font:500 17px/1.3 var(--font-display);margin-top:2px}
.card__note{font-size:14px;color:var(--dim-text);margin-top:var(--s4);line-height:1.5}
.card__foot{font-size:13px;color:var(--dim-text);padding-top:var(--s3);margin-top:var(--s1);border-top:1px solid var(--line-soft)}
.card__actions{display:flex;gap:10px;margin-top:22px}
.card__hint{font-size:12px;color:var(--dim-text);text-align:center;margin-top:var(--s3)}
.pill{font:600 13px/1 var(--font-display);padding:5px 10px;border-radius:var(--r-pill);background:rgba(139,92,246,.22);border:1px solid rgba(196,164,255,.3);white-space:nowrap}
.tag-proactive{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px 5px 8px;border-radius:var(--r-pill);background:rgba(192,38,211,.18);border:1px solid rgba(192,38,211,.5)}
.tag-proactive svg.i{width:14px;height:14px}
.chip{font:12px/1.4 var(--font-display);padding:3px 8px;border-radius:var(--r-xs);background:rgba(196,164,255,.08);border:1px solid rgba(196,164,255,.16)}

/* list rows (calendar) */
.list{display:flex;flex-direction:column;margin-top:10px}
.list__row{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--s3);align-items:center;min-height:44px;border-bottom:1px solid var(--line-soft)}
.list__row:last-child{border-bottom:0}
.list__time{font:500 15px var(--font-display);color:var(--dim-text)}
.list__row.is-next .list__time{font-weight:600;color:var(--lilac)}
.list__title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list__more{font-size:13px;color:var(--dim-text);padding-top:var(--s2)}

/* email rows */
.mail{display:grid;grid-template-columns:32px minmax(0,1fr);gap:var(--s3);padding:14px 0;border-bottom:1px solid var(--line-soft)}
.mail:last-child{border-bottom:0}
.mail__avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(139,92,246,.2);font:600 12px var(--font-display);color:var(--lilac)}
.mail__from{font-size:13px;font-weight:500;color:var(--dim-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail__subject{font-size:15px;line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mail__reason{font-size:12px;color:var(--lilac);margin-top:6px}

/* definition grid (forge) */
.dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px var(--s3);margin-top:18px;padding-top:var(--s4);border-top:1px solid rgba(196,164,255,.1);font-size:14px;align-items:start}
.dl dt{color:var(--dim-text)} .dl dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dl__sub{display:block;width:100%;font-size:12px;color:var(--dim-text)}

/* collapsed row */
.card-row{display:flex;align-items:center;gap:var(--s3);min-height:48px;padding:0 var(--s4);border-radius:var(--r-row);background:var(--glass-row);border:1px solid rgba(196,164,255,.12);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--dim-text);font-size:13px;text-align:left;width:100%;flex:none;transition:background var(--dur-hover)}
.card-row:hover{background:rgba(40,28,78,.6)}
.card-row.is-proactive{border-color:rgba(192,38,211,.28)}
.card-row svg.i{width:16px;height:16px;color:var(--lilac)}
.card-row__type{color:var(--ice);font-weight:500;white-space:nowrap}
.card-row__text{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* buttons */
.btn{flex:1;min-height:46px;padding:0 var(--s4);border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);font-size:15px;font-weight:500;
  background:var(--tint);border:1px solid rgba(196,164,255,.22);color:var(--ice);transition:background var(--dur-hover),box-shadow var(--dur-hover)}
.btn:hover{background:rgba(196,164,255,.12)}
.btn--primary{background:var(--violet-deep);border-color:var(--violet-bright);font-weight:600;box-shadow:var(--glow-btn)}
.btn--primary:hover{background:var(--violet-deep-hover);box-shadow:0 0 32px rgba(168,85,247,.5)}
.btn--sm{flex:none;min-height:32px;padding:0 12px;font-size:12px;border-radius:var(--r-sm)}
.btn svg.i{width:16px;height:16px}

/* motion */
@keyframes eva-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.is-new{animation:eva-rise var(--dur-in) var(--ease-out) both}
.is-leaving{opacity:0;transform:translateX(8px);transition:opacity var(--dur-out) ease-in,transform var(--dur-out) ease-in}

/* ===== Status panel ===== */
.eva-scrim{position:fixed;inset:0;background:rgba(8,6,15,.5);opacity:0;pointer-events:none;transition:opacity var(--dur-layout) var(--ease-out);z-index:10}
.eva.panel-open .eva-scrim,.eva.history-open .eva-scrim{opacity:1;pointer-events:auto}
.eva-panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);z-index:11;padding:calc(var(--safe-t) + 28px) calc(var(--safe-r) + 28px) calc(var(--safe-b) + 32px) 28px;
  background:var(--glass-solid);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--line);box-shadow:-30px 0 80px -30px rgba(139,92,246,.35);
  display:flex;flex-direction:column;gap:22px;overflow-y:auto;transform:translateX(100%);transition:transform var(--dur-layout) var(--ease-out);visibility:hidden}
.eva.panel-open .eva-panel{transform:none;visibility:visible}
.panel__head{display:flex;justify-content:space-between;align-items:center}
.panel__title{font:600 20px var(--font-display);letter-spacing:.04em}
.panel__sec{display:flex;flex-direction:column;gap:10px}
.panel__row{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);font-size:14px}
.panel__row .muted,.muted{color:var(--dim-text)}
.panel__help{font-size:12px;color:var(--dim-text);line-height:1.5}
.seg{display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:var(--r-md);background:rgba(8,6,15,.6);border:1px solid rgba(196,164,255,.14)}
.seg button{height:36px;border-radius:9px;background:transparent;border:1px solid transparent;color:var(--dim-text);font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--violet-deep);border-color:var(--violet-bright);color:var(--ice);font-weight:600}
.bar{height:3px;border-radius:2px;background:rgba(196,164,255,.12);margin-top:var(--s2)}
.bar > i{display:block;height:100%;border-radius:2px;background:var(--violet-bright);box-shadow:0 0 8px var(--violet-bright)}
.num{font:600 20px var(--font-display)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--offline);box-shadow:0 0 8px var(--offline);flex:none}
.dot.is-live{background:var(--violet-bright);box-shadow:0 0 8px var(--violet-bright)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:12px;padding:5px 10px;border-radius:var(--r-pill);border:1px solid rgba(196,164,255,.2)}
.forge-box{display:flex;align-items:center;gap:var(--s3);padding:14px 16px;border-radius:var(--r-row);background:rgba(139,92,246,.12);border:1px solid rgba(196,164,255,.24)}

/* ===== History drawer ===== */
.eva-drawer{position:fixed;left:50%;bottom:0;width:min(760px,100vw);height:min(640px,78vh);z-index:11;transform:translate(-50%,100%);visibility:hidden;
  border-radius:var(--r-panel) var(--r-panel) 0 0;background:var(--glass-solid);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);border-bottom:0;
  box-shadow:0 -30px 80px -30px rgba(139,92,246,.35);display:flex;flex-direction:column;padding-bottom:calc(var(--safe-b) + 16px);transition:transform var(--dur-layout) var(--ease-out)}
.eva.history-open .eva-drawer{transform:translate(-50%,0);visibility:visible}
.drawer__handle{width:40px;height:4px;border-radius:2px;background:rgba(196,164,255,.3);margin:10px auto 0;flex:none}
.drawer__head{display:flex;justify-content:space-between;align-items:center;padding:14px 32px 0;flex:none}
.transcript{flex:1;min-height:0;overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column;gap:18px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 40px);mask-image:linear-gradient(180deg,transparent 0,#000 40px)}
.transcript__empty{margin:auto;color:var(--dim-text);font-size:14px}
.turn{display:grid;grid-template-columns:80px minmax(0,1fr);gap:var(--s4)}
.turn__who{font-size:12px;color:var(--dim-text);padding-top:3px}
.turn--eva .turn__who{font:600 12px var(--font-display);letter-spacing:.12em;color:var(--lilac)}
.turn__text{font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.turn--you .turn__text{color:var(--dim-text)}
.turn__tag{display:inline-block;font-size:11px;padding:1px 8px;margin-right:8px;border-radius:var(--r-pill);background:rgba(192,38,211,.18);border:1px solid rgba(192,38,211,.45);vertical-align:1px}
.drawer__type{padding:0 32px;flex:none}

/* ===== Phone ===== */
@media (max-width:899px){
  .eva{padding:calc(var(--safe-t) + 8px) calc(var(--safe-r) + 16px) calc(var(--safe-b) + 8px) calc(var(--safe-l) + 16px)}
  .eva-clock{display:none}                       /* the OS status bar already shows the time */
  .eva-top{padding-left:8px}
  .eva-main,.eva.has-card .eva-main{display:flex;flex-direction:column;align-items:stretch;gap:var(--s3)}
  .eva-stage{--core:max(120px,min(340px,80vw,calc(100dvh - 380px)));flex:none;margin-top:auto}
  .eva:not(.has-card) .eva-stage{margin-bottom:auto}
  .eva.has-card .eva-stage{--core:max(96px,min(170px,calc(100dvh - 640px)));margin-top:0}
  .eva-caption{font-size:17px;max-width:none;padding:0 12px;margin-top:var(--s2)}
  .eva.has-card .eva-caption{font-size:16px;min-height:0}
  .eva-rail{flex:1;min-height:0;justify-content:flex-end;gap:8px}
  .eva:not(.has-card) .eva-rail{display:none}
  .eva-rail > :first-child{margin-top:auto}      /* anchor to bottom, still scrollable */
  .card{padding:18px 20px}
  .card__big{font-size:38px}
  .card__actions{margin-top:var(--s4)}
  .btn{min-height:48px}
  .card-row{min-height:44px;padding:0 14px}
  .eva-bottom{gap:var(--s2)}
  .eva-dock{width:100%;justify-content:space-between;height:84px;padding:0 18px;border-radius:42px}

  .turn{grid-template-columns:1fr;gap:2px}
}
@media (max-width:899px) and (max-height:700px){ .eva.has-card .eva-caption{-webkit-line-clamp:2} }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}

/* demo switcher (only with ?demo) */

<div class="eva" id="eva">
  <header class="eva-top">
    <div class="eva-conn" id="evaConn" data-live="false" role="status">
      <span class="eva-conn__dot"></span><span class="eva-brand">E.V.A.</span><span class="eva-conn__text">Offline, reconnecting</span>
    </div>
    <div class="eva-top__right">
      <div class="eva-clock" aria-hidden="true"><div class="eva-clock__time" id="evaTime">--:--</div><div class="eva-clock__date" id="evaDate"></div></div>
      <button class="icon-btn" id="evaStatusBtn" aria-label="Status" aria-controls="evaPanel" aria-expanded="false"><svg class="i"><use href="#i-panel"/></svg></button>
    </div>
  </header>

  <main class="eva-main">
    <section class="eva-stage">

      <button class="dock-btn" id="evaKbd" aria-pressed="false" aria-label="Type instead"><svg class="i"><use href="#i-kbd"/></svg></button>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const root = $('eva'), rail = $('evaRail'), caption = $('evaCaption'), canvas = $('evaCore');
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const emit = (name, detail) => window.dispatchEvent(new CustomEvent('eva:' + name, { detail }));

/* ---------- tiny DOM helper (always textContent, never innerHTML) ---------- */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
function icon(name, cls) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('class', 'i' + (cls ? ' ' + cls : ''));
  const u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  u.setAttribute('href', '#i-' + name); s.append(u); return s;
}
const initials = n => String(n || '?').split(/[\s,]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('');

/* ---------- clock ---------- */
function tickClock() {
  const d = new Date();
  $('evaTime').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  $('evaDate').textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'long' });
}
tickClock(); setInterval(tickClock, 15000);

/* ---------- core canvas ---------- */
const core = { state: 'idle', level: null, raf: 0, last: 0 };
function sizeCanvas() {
  const dpr = Math.min(2, devicePixelRatio || 1), r = canvas.getBoundingClientRect();
  const s = Math.max(1, Math.round(r.width * dpr));
  if (canvas.width !== s) { canvas.width = s; canvas.height = s; }
}
new ResizeObserver(() => { sizeCanvas(); if (reduceMQ.matches) drawCore(3.2); }).observe(canvas);

function drawCore(t) {
  const x = canvas.getContext('2d'), W = canvas.width, m = W / 2, R = W * 0.19, TAU = Math.PI * 2, st = core.state;
  const rgba = (k, a) => `rgba(${k[0]},${k[1]},${k[2]},${a})`;
  const L = [196,164,255], V = [139,92,246], B = [168,85,247], M = [192,38,211], I = [239,234,255];
  const hot = st === 'thinking' || st === 'alert';
  const lvl = core.level;
  let r = R, halo = 0.3;
  if (st === 'idle') { const b = 0.5 + 0.5 * Math.sin(t * 1.1); r = R * (0.9 + 0.07 * b); halo = 0.16 + 0.14 * b; }
  if (st === 'listening') { r = R * 0.92; halo = 0.3; }
  if (st === 'thinking') { r = R * 0.68 + Math.sin(t * 6) * R * 0.015; halo = 0.3; }
  if (st === 'speaking') { const e = lvl != null ? lvl : Math.abs(Math.sin(t * 3.3) * Math.sin(t * 1.9 + 1)); r = R * (0.9 + 0.16 * e); halo = 0.24 + 0.24 * e; }
  if (st === 'alert') { const b = 0.5 + 0.5 * Math.sin(t * 2); r = R * (0.9 + 0.05 * b); halo = 0.28 + 0.14 * b; }
  x.clearRect(0, 0, W, W);
  x.globalCompositeOperation = 'lighter';
  let g = x.createRadialGradient(m, m, r * 0.4, m, m, m);
  g.addColorStop(0, rgba(hot ? M : B, halo)); g.addColorStop(0.45, rgba(V, halo * 0.35)); g.addColorStop(1, rgba(V, 0));
  x.fillStyle = g; x.fillRect(0, 0, W, W);
  x.lineWidth = W * 0.0025; x.strokeStyle = rgba(L, 0.16); x.beginPath(); x.arc(m, m, R * 1.6, 0, TAU); x.stroke();
  if (st === 'listening') {
    const amp = lvl != null ? 0.35 + lvl * 1.3 : 1;
    for (let k = 0; k < 2; k++) {
      x.beginPath();
      for (let i = 0; i <= 220; i++) {
        const a = i / 220 * TAU;
        const n = Math.sin(a * 6 + t * 4 + k) * 0.5 + Math.sin(a * 11 - t * 6.3) * 0.3 + Math.sin(a * 3 + t * 2.1) * 0.2;
        const rr = R * (1.3 + k * 0.12) + n * R * (k ? 0.08 : 0.16) * amp;
        const px = m + Math.cos(a) * rr, py = m + Math.sin(a) * rr;
        i ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.closePath(); x.lineWidth = W * (k ? 0.003 : 0.006); x.strokeStyle = rgba(k ? V : L, k ? 0.4 : 0.85); x.stroke();
    }
  }
  if (st === 'thinking') {
    x.lineCap = 'round';
    for (let k = 0; k < 3; k++) {
      const a0 = t * (1.6 + k * 0.7) * (k % 2 ? -1 : 1) + k * 2;
      x.beginPath(); x.arc(m, m, R * (1 + k * 0.16), a0, a0 + Math.PI * (0.5 + k * 0.2));
      x.lineWidth = W * 0.006; x.strokeStyle = rgba(k === 1 ? L : M, 0.8 - k * 0.15); x.stroke();
    }
  }
  if (st === 'speaking' || st === 'alert') {
    const C = st === 'alert' ? M : L, sp = st === 'alert' ? 0.35 : 0.7;
    for (let i = 0; i < 3; i++) {
      const p = (t * sp + i / 3) % 1;
      x.beginPath(); x.arc(m, m, r * (1.1 + p * 1.3), 0, TAU);
      x.lineWidth = W * (0.004 * (1 - p) + 0.001); x.strokeStyle = rgba(C, (1 - p) * 0.5); x.stroke();
    }
  }
  g = x.createRadialGradient(m, m - r * 0.15, 0, m, m, r * 1.15);
  g.addColorStop(0, rgba(I, 0.95)); g.addColorStop(0.25, rgba(L, 0.85)); g.addColorStop(0.6, rgba(hot ? M : B, 0.7)); g.addColorStop(1, rgba(V, 0));
  x.fillStyle = g; x.beginPath(); x.arc(m, m, r * 1.15, 0, TAU); x.fill();
  x.lineWidth = W * 0.003; x.strokeStyle = rgba(I, 0.35); x.beginPath(); x.arc(m, m, r * 0.78, 0, TAU); x.stroke();
  x.globalCompositeOperation = 'source-over';
}
function loop(ts) {
  if (ts - core.last > 16) { core.last = ts; drawCore(ts / 1000); }
  core.raf = requestAnimationFrame(loop);
}
function startCore() {
  cancelAnimationFrame(core.raf); sizeCanvas();
  if (reduceMQ.matches) drawCore(3.2); else core.raf = requestAnimationFrame(loop);
}
reduceMQ.addEventListener('change', startCore);
document.addEventListener('visibilitychange', () => document.hidden ? cancelAnimationFrame(core.raf) : startCore());

function setState(s) {
  core.state = s;
  const mic = $('evaMic');
  mic.dataset.mode = s;
  mic.setAttribute('aria-label', s === 'speaking' ? 'Stop' : s === 'listening' ? 'Stop listening' : 'Talk');
  syncAlert();
  if (reduceMQ.matches) drawCore(3.2);
}

/* ---------- caption ---------- */
function setCaption(text, spoken) {
  caption.textContent = '';
  caption.classList.toggle('is-muted', false);
  if (!text) return;
  if (typeof spoken === 'number' && spoken < text.length) {
    caption.append(h('span', null, text.slice(0, spoken)), h('span', { class: 'eva-caption__rest' }, text.slice(spoken)));
  } else caption.textContent = text;
}
function setHint(text) { caption.textContent = text || ''; caption.classList.add('is-muted'); }

/* ---------- cards ---------- */
const RULES = { maxCollapsed: 2, autoCollapseMs: 45000 };
const WAITS = new Set(['confirm', 'alert', 'forge']);  // these wait for an answer
let cards = [], seq = 0;

const META = {
  weather: ['cloud', 'Weather'], calendar: ['cal', 'Calendar'], email: ['mail', 'Email'], confirm: ['cal', 'Confirm'],
  nowplaying: ['music', 'Now playing'], note: ['note', 'Note'], vision: ['eye', 'Vision'], reminder: ['bell', 'Reminder'],
  alert: ['bell', 'Alert'], forge: ['wrench', 'FORGE draft']
};

function head(label, meta, proactive) {
  return h('div', { class: 'card__head' },
    proactive ? h('span', { class: 'tag-proactive' }, icon('bell'), 'Started by E.V.A.') : h('span', { class: 'card__label' }, label),
    meta ? h('span', { class: 'card__meta' }, meta) : null);
}
function actions(c, list) {
  return h('div', { class: 'card__actions' }, list.map(([action, label, primary, ic]) =>
    h('button', { class: 'btn' + (primary ? ' btn--primary' : ''), onclick: () => answer(c, action) }, ic ? icon(ic) : null, label)));
}
function minutesUntil(hhmm) {
  const [H, M] = String(hhmm).split(':').map(Number); if (isNaN(H)) return null;
  const now = new Date(), t = new Date(); t.setHours(H, M || 0, 0, 0);
  return Math.round((t - now) / 60000);
}

const RENDER = {
  weather(d) {
    const temp = d.temp_c != null ? `${Math.round(d.temp_c)}°` : `${Math.round(d.low_c)}° to ${Math.round(d.high_c)}°`;
    const rain = d.rain_chance_pct != null ? `${d.rain_chance_pct}%` : d.rain_mm != null ? `${d.rain_mm} mm` : null;
    const stats = [['Rain', rain], ['Wind', d.wind_kmh != null ? `${d.wind_kmh} km/h` : null], ['Feels like', d.feels_like_c != null ? `${Math.round(d.feels_like_c)}°` : null]].filter(s => s[1]);
    return [head('Weather', d.source),
      h('div', { class: 'card__sub', style: 'margin-top:16px' }, [d.city, d.when].filter(Boolean).join(', ')),
      h('div', { class: 'card__big' }, temp),
      d.conditions ? h('div', { style: 'font-size:17px;margin-top:2px' }, d.conditions) : null,
      stats.length ? h('div', { class: 'card__stats' }, stats.map(([k, v]) => h('div', null, h('div', { class: 'stat__k' }, k), h('div', { class: 'stat__v' }, v)))) : null,
      d.note ? h('div', { class: 'card__note' }, d.note) : null];
  },
  calendar(d) {
    const ev = d.events || [];
    if (ev.length === 1 || /up next/i.test(d.title || '')) {       // "Up next" variant
      const e = ev[0] || {}, mins = e.minutes ?? minutesUntil(e.time);
      return { accent: true, kids: [h('div', { class: 'card__head' }, h('span', { class: 'card__label' }, d.title || 'Up next'),
          mins != null && mins >= 0 ? h('span', { class: 'pill' }, `in ${mins} min`) : null),
        h('div', { class: 'card__title', style: '-webkit-line-clamp:1' }, e.title),
        h('div', { class: 'card__sub' }, [e.day, e.time, e.where].filter(Boolean).join(' · '))] };
    }
    const shown = ev.slice(0, 5), more = ev.length - shown.length;
    return [head(d.title || 'Still today', `${ev.length} item${ev.length === 1 ? '' : 's'}`),
      h('div', { class: 'list' }, shown.map((e, i) => h('div', { class: 'list__row' + (i === 0 ? ' is-next' : '') },
        h('span', { class: 'list__time' }, e.time || e.day || ''), h('span', { class: 'list__title', title: e.title }, e.title)))),
      more > 0 ? h('div', { class: 'list__more' }, `${more} more`) : null];
  },
  email(d) {
    const em = d.emails || [], shown = em.slice(0, 5);
    return [head('Email', d.source),
      h('div', { style: 'font-size:20px;font-weight:500;margin-top:10px' }, d.title || 'Worth your attention'),
      h('div', { style: 'margin-top:8px' }, shown.map(e => h('div', { class: 'mail' },
        h('span', { class: 'mail__avatar', 'aria-hidden': 'true' }, initials(e.from)),
        h('div', { style: 'min-width:0' }, h('div', { class: 'mail__from' }, e.from), h('div', { class: 'mail__subject' }, e.subject),
          (e.reason || e.snippet) ? h('div', { class: 'mail__reason' }, e.reason || e.snippet) : null)))),
      d.others ? h('div', { class: 'card__foot' }, `${d.others} others can wait.`) : null];
  },
  confirm(d, c) {
    return [head(d.title || 'Just to confirm', d.source),
      h('div', { class: 'card__title', style: '-webkit-line-clamp:3' }, d.text),
      actions(c, [['confirm', 'Go ahead', true], ['cancel', 'Cancel']]),
      h('div', { class: 'card__hint' }, 'Or just say "go ahead"')];
  },
  nowplaying(d) { return [head('Now playing'), h('div', { class: 'card__title' }, d.what)]; },
  note(d) { return [head(d.title || 'Note'), h('div', { class: 'card__text' }, d.text)]; },
  vision(d) { return [head(d.title || 'Vision'), h('div', { class: 'card__text' }, d.text)]; },
  reminder(d, c) { return RENDER.alert({ kind: 'Reminder', title: d.title, text: d.text }, c); },
  alert(d, c) {
    return [head(null, d.when || 'Just now', true),
      h('div', { class: 'card__label', style: 'margin-top:18px' }, d.kind || 'Heads up'),
      h('div', { class: 'card__title', style: 'margin-top:6px;font-size:22px' }, d.title),
      d.text ? h('div', { class: 'card__sub', style: 'margin-top:6px' }, d.text) : null,
      actions(c, [['snooze', d.snooze_label || 'Snooze 5 min', true, 'snooze'], ['dismiss', 'Got it']])];
  },
  forge(d, c) {
    const hosts = d.hosts || [];
    return [head('FORGE draft', d.position),
      h('div', { style: "font:600 24px var(--font-display);margin-top:12px" }, d.name),
      h('div', { class: 'card__text', style: 'margin-top:4px' }, d.summary),
      h('dl', { class: 'dl' },
        h('dt', null, 'Tools'), h('dd', null, (d.tools || []).map(t => h('span', { class: 'chip' }, t))),
        h('dt', null, 'Internet'), h('dd', null, hosts.length ? [hosts.join(', '), h('span', { class: 'dl__sub' }, 'Only these hosts. Nothing else leaves your machine.')] : 'Works offline'),
        h('dt', null, 'Safety'), h('dd', null, icon('check'), d.review_passed === false ? 'Security review not passed' : `Passed security review and ${d.tests ?? 0} tests`),
        d.cost ? h('dt', null, 'Cost') : null, d.cost ? h('dd', null, d.cost) : null),
      actions(c, [['install', 'Install', true], ['discard', 'Discard']])];
  }
};

function handle(ev) {
  switch (ev.type) {
    case 'hello': ttsMode = ev.tts || 'browser'; break;
    case 'phrase': if (ev.key === 'wake') decode(ev.audio).then(b => { P.wake = b; }); break;
    case 'turn_start': beginTurn(ev.turn); streamBuf = ''; turnText = ''; turnProactive = false; proactiveWidget = null; break;
    case 'heard':
      if (ev.stt) { lastWasVoice = true; E.addTranscript({ role: 'you', text: ev.text, time: hm() }); setState('thinking'); micTouch(); }
      caption(ev.text); break;
    case 'stt': onStt(ev); break;
    case 'listen': onListen(ev); break;
    case 'wake': caption(ev.text || 'Yes, sir?'); playWake(); micTouch(); break;
    case 'barge_in':
      if (ev.stage === 'duck') duck(true);
      else if (ev.stage === 'resume') duck(false);
      else if (ev.stage === 'stop') { stopAudio(); setState('listening'); E.setHint('Go on...'); }
      break;
    case 'ack': setState('thinking'); caption(ev.text); if (ttsMode !== 'kokoro') speak(ev.text); break;
    case 'token': streamBuf += ev.text; caption(streamBuf, 0); break;
    case 'widget':
      if (ev.proactive) { proactiveWidget = ev.data; turnProactive = true; }
      else { const c = toCard(ev.data); if (c) E.showCard(c.type, c.data); }
      break;
    case 'final': {
      const t = ev.text || streamBuf; turnText = t; streamBuf = '';
      if (ev.proactive) {
        turnProactive = true;
        const c = proactiveCard(proactiveWidget, t);
        E.showCards([{ type: c.type, data: c.data, proactive: true }]); setState('alert');
        E.addTranscript({ role: 'eva', text: t, time: hm(), proactive: true });
      } else {
        E.addTranscript({ role: 'eva', text: t, time: hm() });
      }
      caption(t, ttsMode === 'kokoro' ? 0 : undefined);
      if (ttsMode !== 'kokoro') speak(t, (lastWasVoice || wakeMode) && !ev.proactive ? followUp : null); else kick();
      break;
    }
    case 'audio': onAudio(ev); break;
    case 'audio_end': onAudioEnd(ev); break;
  }
}
function send(text, viaVoice) {
  if (!text) return;
  lastWasVoice = !!viaVoice; stopAudio(); stopListening();
  E.addTranscript({ role: 'you', text, time: hm() });
  if (connected && ws && ws.readyState === 1) { setState('thinking'); caption(text); ws.send(JSON.stringify({ type: 'message', text, voice: !!viaVoice })); }
  else { setState('idle'); E.setHint('Not connected. Retrying...'); }
}
function bargeIn() { const busy = isSpeaking() || state === 'thinking'; stopAudio();
  if (busy && connected && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'stop' })); }
function idleHint() { E.setHint(wakeMode ? 'Listening for "Hey Eva"' : 'Tap the mic, or type'); }

/* ---------------- server-side listening (v0.2.5): mic -> PCM16 16 kHz -> E.V.A. ---------------- */
/*DOWNSAMPLER-START*/
function makeDownsampler(inRate, outRate, block) {
  // Box-filter downsampling to 16-bit PCM in fixed blocks (512 samples = 32 ms at 16 kHz, Silero's window).
  const ratio = inRate / outRate; let pos = 0, acc = 0, cnt = 0, n = 0, buf = new Int16Array(block);
  return function push(input) {
    const out = [];
    for (let i = 0; i < input.length; i++) {
      acc += input[i]; cnt++; pos += 1;
      if (pos >= ratio) {
        pos -= ratio; const v = Math.max(-1, Math.min(1, acc / cnt)); acc = 0; cnt = 0;
        buf[n++] = v < 0 ? Math.round(v * 32768) : Math.round(v * 32767);
        if (n === block) { out.push(buf); buf = new Int16Array(block); n = 0; }
      }
    }
    return out;
  };
}
/*DOWNSAMPLER-END*/
const WORKLET = makeDownsampler.toString() + `
class EvaPcm16 extends AudioWorkletProcessor {
  constructor() { super(); this.push = makeDownsampler(sampleRate, 16000, 512); }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) for (const b of this.push(ch)) {
      let s = 0; for (let i = 0; i < b.length; i++) { const x = b[i] / 32768; s += x * x; }
      this.port.postMessage({ pcm: b.buffer, level: Math.sqrt(s / b.length) }, [b.buffer]);
    }
    return true;
  }
}
registerProcessor('eva-pcm16', EvaPcm16);`;
const MIC = { stream: null, ctx: null, node: null, starting: null, idle: 0 };
function micOn() { return !!MIC.node; }
async function micStart() {
  if (MIC.node) return true;
  if (MIC.starting) return MIC.starting;
  MIC.starting = (async () => {
    try {
      if (!navigator.mediaDevices || !window.AudioWorkletNode) throw new Error('no AudioWorklet');
      MIC.stream = await navigator.mediaDevices.getUserMedia({ audio: {
        echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
      const C = window.AudioContext || window.webkitAudioContext; MIC.ctx = new C();
      const url = URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }));
      await MIC.ctx.audioWorklet.addModule(url); URL.revokeObjectURL(url);
      const src = MIC.ctx.createMediaStreamSource(MIC.stream);
      MIC.node = new AudioWorkletNode(MIC.ctx, 'eva-pcm16');
      MIC.node.port.onmessage = e => {
        if (sttMode !== 'server' || !ws || ws.readyState !== 1) return;
        if (ws.bufferedAmount < 1 << 20) ws.send(e.data.pcm);          // never pile up audio on a slow link
        if (state === 'listening' && !isSpeaking()) E.setLevel(Math.min(1, e.data.level * 6));
      };
      src.connect(MIC.node); MIC.node.connect(MIC.ctx.destination);   // outputs silence; keeps the node running
      if (MIC.ctx.state === 'suspended') await MIC.ctx.resume();
      return true;
    } catch (err) {
      micRelease(); sttMode = 'browser'; sttReason = 'microphone: ' + (err && err.message || err);
      console.warn('E.V.A.: server listening unavailable, using browser speech recognition.', err);
      return false;
    } finally { MIC.starting = null; }
  })();
  return MIC.starting;
}
function micRelease() {
  clearTimeout(MIC.idle);
  if (MIC.stream) MIC.stream.getTracks().forEach(t => t.stop());
  if (MIC.ctx) MIC.ctx.close().catch(() => {});
  MIC.stream = MIC.ctx = MIC.node = null;
}
function micTouch() {                                          // tap mode: free the mic after 30 s of nothing
  clearTimeout(MIC.idle);
  if (!wakeMode) MIC.idle = setTimeout(() => { if (!wakeMode && state === 'idle') micRelease(); else micTouch(); }, 30000);
}
function sendCtl(msg) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg)); }
function armServer(ms, hint) { sendCtl({ type: 'listen', arm: ms }); setState('listening'); E.setHint(hint || 'Listening...'); micTouch(); }
async function tapServer() {
  if (await micStart()) armServer(8000, 'Listening...');
  else { idleHint(); listen(0); }
}
function onStt(ev) {
  sttMode = ev.engine === 'server' ? 'server' : 'browser'; sttReason = ev.reason || '';
  if (sttMode === 'server') {
    if (wakeMode) { stopListening(); micStart().then(ok => { if (ok) sendCtl({ type: 'listen', wake: true }); else startWake(); }); }
  } else {
    micRelease();
    if (sttReason) console.info('E.V.A. listening: browser speech recognition (' + sttReason + ')');
    if (state === 'listening') { setState('idle'); idleHint(); }
    if (wakeMode) startWake();
  }
}
function onListen(ev) {
  if (ev.state === 'speech') { setState('listening'); E.setHint('Listening...'); micTouch(); }
  else if (ev.state === 'end') { setState('thinking'); E.setLevel(null); }
  else if (ev.state === 'noise' || ev.state === 'timeout') {
    if (state === 'listening' || state === 'thinking') { setState('idle'); E.setLevel(null); idleHint(); }
  }
}

/* ---------------- speech recognition: tap, follow-up, wake word ---------------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, fol = null, wakeRec = null;
function stopListening() { for (const r of [rec, fol, wakeRec]) if (r) { try { r.onend = null; r.stop(); } catch (_) {} } rec = fol = wakeRec = null; }
function recognizer(continuous) { const r = new SR(); r.lang = 'en-US'; r.interimResults = true; r.continuous = continuous; return r; }
function listen(windowMs) {
  if (!SR) { E.setHint('Voice input needs Chrome or Edge. Type instead.'); return; }
  stopListening(); const r = recognizer(false); let fin = '';
  if (windowMs) fol = r; else rec = r;
  setState('listening'); E.setHint(windowMs ? 'Go on...' : 'Listening...');
  const timer = windowMs ? setTimeout(() => { try { r.stop(); } catch (_) {} }, windowMs) : null;
  r.onresult = e => { let itm = ''; for (let i = e.resultIndex; i < e.results.length; i++) {
    const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t; else itm += t; } caption(fin || itm); };
  r.onerror = () => {};
  r.onend = () => { clearTimeout(timer); if (fol === r) fol = null; if (rec === r) rec = null;
    const done = fin.trim(); if (done) send(done, true); else { setState('idle'); idleHint(); if (wakeMode) ensureWake(); } };
  try { r.start(); } catch (_) { setState('idle'); }
}
const followUp = () => (sttMode === 'server' && micOn()) ? armServer(7000, 'Go on...') : listen(7000);
function ensureWake() { if (wakeMode && SR && !wakeRec && !isSpeaking() && state !== 'listening') startWake(); }
function startWake() {
  if (sttMode === 'server') return;                            // E.V.A. hears the wake word herself
  if (wakeRec || !SR) return;
  wakeRec = recognizer(true); let armed = false;
  wakeRec.onresult = e => { const last = e.results[e.results.length - 1], t = last[0].transcript.toLowerCase();
    if (!armed && /\b(eva|eve|ava|hey eva)\b/.test(t)) {
      const cmd = t.replace(/.*\b(hey eva|eva|eve|ava)\b[\s,]*/, '').trim();
      if (last.isFinal && cmd.length > 2) { send(cmd, true); return; }
      armed = true; caption('Yes, sir?'); playWake(followUp);
    } else if (armed && last.isFinal) { const cmd = t.replace(/\b(eva|eve|ava|hey eva)\b/, '').trim(); if (cmd.length > 2) { armed = false; send(cmd, true); } } };
  wakeRec.onerror = () => {};
  wakeRec.onend = () => { wakeRec = null; setTimeout(ensureWake, 400); };
  try { wakeRec.start(); } catch (_) { wakeRec = null; }
}

/* ---------------- UI events -> server ---------------- */
addEventListener('eva:mic', () => {
  if (state === 'speaking' || state === 'thinking' || isSpeaking()) { bargeIn(); setState('idle'); idleHint(); }
  else if (state === 'listening') { if (sttMode === 'server') sendCtl({ type: 'listen', arm: 0 }); stopListening(); setState('idle'); idleHint(); }
  else { bargeIn(); if (sttMode === 'server') tapServer(); else listen(0); }
});
addEventListener('eva:text', e => send((e.detail && e.detail.text || '').trim(), false));
addEventListener('eva:wake', e => { wakeMode = !!(e.detail && e.detail.on);
  if (sttMode === 'server') {
    if (wakeMode) micStart().then(ok => { if (ok) sendCtl({ type: 'listen', wake: true }); else startWake(); });
    else { sendCtl({ type: 'listen', wake: false, arm: 0 }); micTouch(); setState('idle'); }
  } else if (wakeMode) startWake(); else { stopListening(); setState('idle'); }
  idleHint(); });
addEventListener('eva:action', e => {
  const a = e.detail && e.detail.action;
  if (a === 'confirm' || a === 'install') send('yes', false);
  else if (a === 'cancel' || a === 'discard') send('no', false);
  else if (a === 'snooze') send('snooze it', false);
  if (a !== 'dismiss' && state === 'alert') setState('idle');
});
addEventListener('eva:brain-mode', e => send(`switch to ${e.detail.mode} mode`, false));
addEventListener('eva:forge-review', () => send('which skills are waiting', false));

/* ---------------- status panel ---------------- */
async function refreshStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    E.setStatus({
      voice: { name: s.voice === 'kokoro' ? 'Kokoro' : 'Browser voice',
        detail: (s.voice === 'kokoro' ? 'local' : 'fallback') + (sttMode === 'server' ? ' · hears you locally' : ' · browser listening') },
      brainMode: s.brain_mode || 'auto',
      budget: { today: [s.budget.spent, s.budget.limit], month: [s.budget.month_spent, s.budget.month_limit] },
      memory: { facts: s.memory.facts, turns: s.memory.episodes },
      connections: [{ name: 'Google', detail: 'Calendar, Gmail', live: !!s.google }, { name: 'Telegram', live: !!s.telegram },
        ...(s.mcp || []).map(m => ({ name: 'MCP · ' + m.name, live: !!m.connected }))],
      skills: (s.skills || []).filter(k => k.enabled).map(k => k.name), forgeDrafts: s.forge_drafts || 0 });
  } catch (_) {}
}
setInterval(() => { if (connected) refreshStatus(); }, 30000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
connect();
})();
</script>
