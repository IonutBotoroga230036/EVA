name: eva_android
description: E.V.A. for Android. Your desktop E.V.A. interface, on your phone.
publish_to: none
version: 0.3.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0          # E.V.A.'s real interface, same orb and animation as on the PC
  webview_flutter_android: any      # mic permission for the page, audio without a tap (same major as above)
  flutter_secure_storage: ^9.2.2    # address and token, in Android's encrypted storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
